const bgm = document.getElementById('bgm');

const MusicMgr = {
  sceneMode: 'normal',  // 'normal'|'happy'|'sad'|'chaos'
  tempMode: null,       // 'hurt'|'bosskill'|null
  usingReverse: false,
  currentRate: 1.0,
  targetRate: 1.0,
  _hurtT: null,
  _bossT: null,

  setSceneMode(mode){
    this.sceneMode = mode;
    this._update();
  },
  setTempMode(mode){
    this.tempMode = mode;
    this._update();
    if(mode==='hurt'){
      clearTimeout(this._hurtT);
      this._hurtT = setTimeout(()=>{ if(this.tempMode==='hurt') this.setTempMode(null); }, 900);
    } else if(mode==='bosskill'){
      clearTimeout(this._bossT);
      this._bossT = setTimeout(()=>{ if(this.tempMode==='bosskill') this.setTempMode(null); }, 3500);
    }
  },
  _update(){
    if(this.sceneMode === 'chaos') this._enableReverse();
    else this._disableReverse();

    const r = this.tempMode || this.sceneMode;
    if(r==='chaos') this.targetRate = 5.0;
    else if(r==='happy') this.targetRate = 1.85;
    else if(r==='sad') this.targetRate = 0.32;
    else if(r==='hurt') this.targetRate = 0.30;
    else if(r==='bosskill') this.targetRate = 2.2;
    else this.targetRate = 1.0;
  },
  _enableReverse(){
    if(this.usingReverse) return;
    this.usingReverse = true;
    if(bgm) bgm.pause();
    if(reversedBuffer && audioCtx && musicEnabled){
      if(reverseSource){ try{ reverseSource.stop(); }catch(e){} }
      reverseSource = audioCtx.createBufferSource();
      reverseSource.buffer = reversedBuffer;
      reverseSource.loop = true;
      reverseSource.playbackRate.value = this.currentRate;
      reverseSource.connect(audioCtx.destination);
      reverseSource.start();
    }
  },
  _disableReverse(){
    if(!this.usingReverse) return;
    this.usingReverse = false;
    if(reverseSource){ try{ reverseSource.stop(); }catch(e){} reverseSource = null; }
    if(bgm && musicEnabled){
      bgm.preservesPitch = false;
      bgm.playbackRate = this.currentRate;
      bgm.volume = 0.4;
      bgm.play().catch(()=>{});
    }
  },
  tick(){
    const diff = this.targetRate - this.currentRate;
    if(Math.abs(diff) < 0.01) this.currentRate = this.targetRate;
    else this.currentRate += diff * 0.12;

    if(this.usingReverse && reverseSource){
      try { reverseSource.playbackRate.value = this.currentRate; } catch(e){}
    } else if(bgm){
      try {
        bgm.preservesPitch = false;
        bgm.playbackRate = this.currentRate;
      } catch(e){}
    }
  }
};

async function setupAudioCtx(){
  try {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') await audioCtx.resume();
    if(!reversedBuffer){
      const res = await fetch('music.mp3');
      if(!res.ok) throw new Error('fetch');
      const buf = await res.arrayBuffer();
      const audioBuffer = await audioCtx.decodeAudioData(buf);
      const rev = audioCtx.createBuffer(audioBuffer.numberOfChannels, audioBuffer.length, audioBuffer.sampleRate);
      for(let c=0;c<audioBuffer.numberOfChannels;c++){
        const src = audioBuffer.getChannelData(c);
        const dst = rev.getChannelData(c);
        for(let i=0;i<src.length;i++) dst[i] = src[src.length-1-i];
      }
      reversedBuffer = rev;
    }
    return true;
  } catch(e){
    console.warn('Audio setup failed:', e);
    return false;
  }
}

function tryPlayMusic(){
  if(!musicEnabled || MusicMgr.usingReverse) return;
  if(bgm && bgm.paused){ bgm.volume = 0.4; bgm.play().catch(()=>{}); }

async function hashPassword(pw){
  const buf=new TextEncoder().encode(pw);
  const h=await crypto.subtle.digest('SHA-256',buf);
  return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function isBinConfigured(){ return !JSONBIN_BIN_ID.includes('COLE_AQUI') && !JSONBIN_MASTER_KEY.includes('COLE_AQUI'); }

async function readBin(){
  for(let i=0;i<3;i++){
    try{
      const r=await fetch(`${API_URL}/latest`,{headers:{'X-Master-Key':JSONBIN_MASTER_KEY}});
      if(r.status===429){ await sleep(1500*(i+1)); continue; }
      if(!r.ok) throw new Error('read '+r.status);
      const d=await r.json(); return d.record;
    }catch(e){ if(i===2) throw e; await sleep(600*(i+1)); }
  }
}
async function writeBin(data){
  for(let i=0;i<3;i++){
    try{
      const r=await fetch(API_URL,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':JSONBIN_MASTER_KEY},body:JSON.stringify(data)});
      if(r.status===429){ await sleep(2000*(i+1)); continue; }
      if(!r.ok) throw new Error('write '+r.status);
      return true;
    }catch(e){ if(i===2) return false; await sleep(800*(i+1)); }
  }
  return false;
}

async function onlinePoll(){

      if(!lobby.bullets) lobby.bullets=[];
      const now=Date.now();

        onlinePlayers.push({id,...p});

const TILE_SIZE = 320;
let hellTiles = [];

function generateHellTiles(){
  srand(11111);
  for(let variant=0; variant<4; variant++){
    const c=document.createElement('canvas');
    c.width=c.height=TILE_SIZE;
    const g=c.getContext('2d');
    const baseGrd = g.createRadialGradient(TILE_SIZE/2,TILE_SIZE/2,50,TILE_SIZE/2,TILE_SIZE/2,TILE_SIZE*0.75);
    baseGrd.addColorStop(0,'#180400');
    baseGrd.addColorStop(1,'#080000');
    g.fillStyle = baseGrd;
    g.fillRect(0,0,TILE_SIZE,TILE_SIZE);
    for(let i=0;i<15;i++){
      const x=rnd()*TILE_SIZE, y=rnd()*TILE_SIZE, w=20+rnd()*60, h=20+rnd()*60;
      g.fillStyle=`rgba(${30+rnd()*20|0},${8+rnd()*10|0},${4+rnd()*8|0},0.6)`;
      g.fillRect(x,y,w,h);
    }
    g.strokeStyle='rgba(0,0,0,0.8)';
    for(let i=0;i<10;i++){
      g.lineWidth=1+rnd()*2;
      g.beginPath();
      let x=rnd()*TILE_SIZE, y=rnd()*TILE_SIZE;
      g.moveTo(x,y);
      for(let j=0;j<6;j++){ x+=(rnd()-0.5)*60; y+=(rnd()-0.5)*60; g.lineTo(x,y); }
      g.stroke();
    }
    for(let i=0;i<5;i++){
      g.strokeStyle=`rgba(255,${40+rnd()*40|0},0,${0.3+rnd()*0.4})`;
      g.lineWidth=2+rnd()*2;
      g.shadowBlur=15; g.shadowColor='#f00';
      g.beginPath();
      let x=rnd()*TILE_SIZE, y=rnd()*TILE_SIZE;
      g.moveTo(x,y);
      for(let j=0;j<8;j++){ x+=(rnd()-0.5)*50; y+=(rnd()-0.5)*50; g.lineTo(x,y); }
      g.stroke();
      g.shadowBlur=0;
    }
    for(let i=0;i<6;i++){
      const x=rnd()*TILE_SIZE, y=rnd()*TILE_SIZE, r=15+rnd()*35;
      const grd=g.createRadialGradient(x,y,0,x,y,r);
      grd.addColorStop(0,`rgba(${80+rnd()*30|0},0,0,0.7)`);
      grd.addColorStop(1,'rgba(30,0,0,0)');
      g.fillStyle=grd;
      g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill();
    }
    for(let i=0;i<3;i++){
      const x=rnd()*TILE_SIZE, y=rnd()*TILE_SIZE, s=8+rnd()*12;
      g.fillStyle='rgba(180,170,150,0.4)';
      g.beginPath(); g.arc(x,y,s,0,Math.PI*2); g.fill();
      g.fillStyle='rgba(30,20,10,0.7)';
      g.beginPath(); g.arc(x-s*0.4,y-s*0.2,s*0.3,0,Math.PI*2); g.fill();
      g.beginPath(); g.arc(x+s*0.4,y-s*0.2,s*0.3,0,Math.PI*2); g.fill();
    }
    hellTiles.push(c);
  }
}

function levelUp(){
  player.xp -= player.xpNext;
  player.level++;
  player.xpNext = 50 + player.level*30;
  player.maxHp += 50;
  player.hp = Math.min(player.maxHp, player.hp + 80);
  player.dmg += cheatCrazygun ? 30 : 14;
  player.atkRate = Math.max(cheatCrazygun?2:10, player.atkRate-1);
  player.speed = 4.5 + player.level*0.08 + (cheatCrazygun?1.5:0);
  flash=0.6; flashColor='#0f0';
  for(let i=0;i<30;i++) particles.push({x:player.x,y:player.y,vx:(Math.random()-0.5)*12,vy:(Math.random()-0.5)*12,life:40,color:'#0f0',r:3+Math.random()*4});
}

function spawnMinion(){
  if(enemies.length>=60) return;
  const ang=Math.random()*Math.PI*2, dist=550+Math.random()*500;
  let x=player.x+Math.cos(ang)*dist;
  let y=player.y+Math.sin(ang)*dist;
  x=Math.max(50,Math.min(WORLD_W-50,x));
  y=Math.max(50,Math.min(WORLD_H-50,y));
  const tier=1+Math.floor(player.level/3);
  const roll=Math.random();
  let e;
  if(roll<0.55) e={x,y,r:15,hp:25*tier,maxHp:25*tier,dmg:8+tier*2,speed:1.4+tier*0.10,xp:8+tier*3,type:'jiangshi',color:'#c00',atkCd:0};
  else if(roll<0.80) e={x,y,r:13,hp:20*tier,maxHp:20*tier,dmg:6+tier*2,speed:1.1+tier*0.10,xp:12+tier*3,type:'spirit',color:'#f0f',atkCd:60+Math.random()*60};
  else if(roll<0.92) e={x,y,r:26,hp:80*tier,maxHp:80*tier,dmg:14+tier*3,speed:0.9+tier*0.05,xp:25+tier*5,type:'tank',color:'#800',atkCd:0};
  else e={x,y,r:20,hp:40*tier,maxHp:40*tier,dmg:20+tier*3,speed:1.8+tier*0.10,xp:20+tier*4,type:'exploder',color:'#ff0',atkCd:0};
  enemies.push(e);
}

function onPlayerHit(dmg){
  player.hp -= dmg;
  player.invuln = 40;
  shake = 15;
  redFlash = 0.6;
  MusicMgr.setTempMode('hurt');
  const ang = Math.random()*Math.PI*2;
  for(let i=0;i<15;i++){
    particles.push({
      x:player.x, y:player.y,
      vx:Math.cos(ang+(Math.random()-0.5))*10,
      vy:Math.sin(ang+(Math.random()-0.5))*10,
      life:30, color:'#f00', r:3+Math.random()*4
    });
  }
}

function useBomb(){
  if(!player||player.bombs<=0) return;
  player.bombs--;
  shake = 60; flash = 1; flashColor = cheatCrazygun ? '#fff' : '#f00';
  const R = cheatCrazygun ? 900 : 450;
  const DMG = cheatCrazygun ? 5000 : 200;

  bombEffects.push({ x:player.x, y:player.y, radius:10, maxRadius:R, alpha:1, type: cheatCrazygun?'nuke':'hellfire' });

  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(Math.hypot(e.x-player.x,e.y-player.y)<R){
      e.hp -= DMG;
      dmgTexts.push({x:e.x,y:e.y,text:DMG.toString(),life:40,color:'#f0f',vy:-1});
      if(e.hp<=0){ xpOrbs.push({x:e.x,y:e.y,xp:e.xp}); enemies.splice(i,1); kills++; addCombo(); }
    }
  }
  for(const bo of bosses){
    if(!bo.alive) continue;
    if(Math.hypot(bo.x-player.x,bo.y-player.y)<R){
      bo.hp -= DMG * 1.5;
      reportBossDamage(bo.zoneId, DMG*1.5);
      if(bo.hp<=0) killBoss(bo);
    }
  }
  enemyBullets = [];

  const pCount = cheatCrazygun ? 150 : 60;
  for(let i=0;i<pCount;i++){
    const ang = Math.random()*Math.PI*2;
    const speed = 5 + Math.random()*(cheatCrazygun?30:18);
    particles.push({
      x:player.x, y:player.y,
      vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed,
      life: 60+Math.random()*40,
      color: cheatCrazygun ? ['#fff','#ff0','#f00','#f80'][Math.floor(Math.random()*4)] : (Math.random()>0.5?'#f00':'#ff0'),
      r: 3+Math.random()*6
    });
  }
  if(cheatCrazygun) crazygunFlashTimer = 30;
}

function addCombo(){ combo++; comboTimer = 180; }
function comboMultiplier(){ return Math.min(3.0, 1 + Math.floor(combo/10) * 0.15); }

function killBoss(bo){
  bo.alive=false; bossesKilled++;
  flash=1; flashColor='#fff'; shake = 50;
  MusicMgr.setTempMode('bosskill');
  for(let k=0;k<120;k++){
    const ang = Math.random()*Math.PI*2;
    const speed = 5 + Math.random()*25;
    particles.push({
      x:bo.x, y:bo.y,
      vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed,
      life: 80+Math.random()*40,
      color: Math.random()>0.5?'#f00':'#ff0',
      r: 4+Math.random()*7
    });
  }
  xpOrbs.push({x:bo.x, y:bo.y, xp:bo.xp, big:true});
  if(bossesKilled>=10) endGame(true);
}

function endGame(won){
  gameState = won ? 'win' : 'gameover';
  shake = 40;
  MusicMgr.setSceneMode('normal');
  const pp = player.level*100 + bossesKilled*2500 + kills*5 + Math.floor(time*3);
  pendingScore = { level: player.level, kills, bosses: bossesKilled, tempo: time, pp };
  if(currentUser) saveScore(currentUser, pendingScore);
}

// MOVEMENT HELPERS
// ============================================================
function movePlayerGeneric(boundW, boundH){
  let mx=0, my=0;
  if(keys['w']||keys['arrowup']) my-=1;
  if(keys['s']||keys['arrowdown']) my+=1;
  if(keys['a']||keys['arrowleft']) mx-=1;
  if(keys['d']||keys['arrowright']) mx+=1;

  if(mx||my){
    const m=Math.hypot(mx,my);
    player.x += (mx/m)*player.speed;
    player.y += (my/m)*player.speed;
  } else if(isMobile && pointerActive){
    const wx=camX+pointerSX, wy=camY+pointerSY;
    const dx=wx-player.x, dy=wy-player.y, d=Math.hypot(dx,dy);
    if(d>15){ player.x+=(dx/d)*player.speed; player.y+=(dy/d)*player.speed; }
  } else if(!isMobile && mouseControlEnabled){
    const wx=camX+pointerSX, wy=camY+pointerSY;
    const dx=wx-player.x, dy=wy-player.y, d=Math.hypot(dx,dy);
    if(d>15){ player.x+=(dx/d)*player.speed; player.y+=(dy/d)*player.speed; }
  }
  player.x = Math.max(30, Math.min(boundW-30, player.x));
  player.y = Math.max(30, Math.min(boundH-30, player.y));
}

// ============================================================
// UPDATE — MAIN WORLD
// ============================================================
function updateMain(){
  time += 1/60;
  if(shake>0){ shake *= 0.9; if(shake<0.5) shake=0; }
  if(flash>0) flash -= 0.02;
  if(redFlash>0) redFlash -= 0.03;
  if(crazygunFlashTimer>0) crazygunFlashTimer--;
  if(comboTimer>0){ comboTimer--; if(comboTimer<=0) combo=0; }
  if(exitCooldown>0) exitCooldown--;

  MusicMgr.tick();
  movePlayerGeneric(WORLD_W, WORLD_H);

  const tcx=Math.max(0,Math.min(WORLD_W-W,player.x-W/2));
  const tcy=Math.max(0,Math.min(WORLD_H-H,player.y-H/2));
  camX+=(tcx-camX)*0.15;
  camY+=(tcy-camY)*0.15;

  if(player.atkCd>0) player.atkCd--;
  if(player.invuln>0) player.invuln--;

  // check doors
  if(exitCooldown<=0){
    for(const door of doors){
      if(Math.hypot(door.x-player.x, door.y-player.y) < door.r + player.r){
        enterPocket(door);
        return;
      }
    }
  }

  // lava
  for(const d of DECORATIONS){
    if(d.type!=='lava') continue;
    const dx = player.x - d.x, dy = player.y - d.y;
    if(dx*dx+dy*dy < (d.r+player.r)*(d.r+player.r) && player.invuln<=0){
      onPlayerHit(30 + currentZoneIdx()*15);
    }
  }

  if(player.atkCd<=0){
    let closest=null, best=player.atkRange*player.atkRange;
    for(const e of enemies){ const dd=(e.x-player.x)**2+(e.y-player.y)**2; if(dd<best){ best=dd; closest=e; } }
    for(const bo of bosses){ if(!bo.alive) continue; const dd=(bo.x-player.x)**2+(bo.y-player.y)**2; if(dd<best){ best=dd; closest=bo; } }
    if(closest){
      const ang=Math.atan2(closest.y-player.y, closest.x-player.x);
      const isCrit = Math.random() < 0.05;
      const dmgVal = player.dmg * (isCrit?3:1);
      const color = cheatCrazygun ? `hsl(${Math.random()*360|0},100%,60%)` : '#ff2222';
      const nb = { x:player.x, y:player.y, vx:Math.cos(ang)*16, vy:Math.sin(ang)*16, r: cheatCrazygun?10:7, dmg:dmgVal, life:40, color, isCrit, crazy: cheatCrazygun };
      bullets.push(nb);
      reportBullet(nb);
      player.atkCd = player.atkRate;
    }
  }

  spawnTimer--;
  if(spawnTimer<=0){ spawnMinion(); spawnTimer = Math.max(8, 45-player.level*2); }

  // enemies
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    const dx=player.x-e.x, dy=player.y-e.y, d=Math.hypot(dx,dy)||1;
    if(e.type==='spirit'){
      if(d>350){ e.x+=dx/d*e.speed; e.y+=dy/d*e.speed; }
      else if(d<250){ e.x-=dx/d*e.speed; e.y-=dy/d*e.speed; }
      if(e.atkCd>0) e.atkCd--;
      else if(d<550){
        const ang=Math.atan2(dy,dx);
        enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(ang)*5,vy:Math.sin(ang)*5,r:8,dmg:e.dmg,color:'#f0f'});
        e.atkCd=100;
      }
    } else if(e.type==='exploder'){
      e.x+=dx/d*e.speed; e.y+=dy/d*e.speed;
      if(d<e.r+player.r+20 && player.invuln<=0){
        onPlayerHit(e.dmg);
        for(let k=0;k<20;k++){ const ang = Math.random()*Math.PI*2; particles.push({x:e.x,y:e.y,vx:Math.cos(ang)*10,vy:Math.sin(ang)*10,life:30,color:'#ff0',r:4+Math.random()*4}); }
        enemies.splice(i,1); kills++;
        continue;
      }
    } else {
      e.x+=dx/d*e.speed; e.y+=dy/d*e.speed;
      if(d<e.r+player.r && player.invuln<=0){ onPlayerHit(e.dmg); e.x-=dx/d*50; e.y-=dy/d*50; }
    }
    if(d>2200) enemies.splice(i,1);
  }

  // player bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx; b.y+=b.vy; b.life--;
    let hit=false;
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      if((e.x-b.x)**2+(e.y-b.y)**2<(e.r+b.r)**2){
        e.hp-=b.dmg;
        if(b.isCrit) dmgTexts.push({x:e.x,y:e.y-e.r,text:t('crit')+' '+Math.round(b.dmg),life:50,color:'#ff0',vy:-1.5,size:24});
        else dmgTexts.push({x:e.x,y:e.y-e.r,text:Math.round(b.dmg),life:40,color: cheatCrazygun?'#f0f':'#fff',vy:-1});
        if(e.hp<=0){
          const xpGain = e.xp * comboMultiplier();
          xpOrbs.push({x:e.x,y:e.y,xp:xpGain});
          for(let k=0;k<8;k++) particles.push({x:e.x,y:e.y,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8,life:30,color:e.color,r:3+Math.random()*3});
          enemies.splice(j,1); kills++; addCombo();
        }
        hit=true; break;
      }
    }
    if(!hit){
      for(const bo of bosses){
        if(!bo.alive) continue;
        if((bo.x-b.x)**2+(bo.y-b.y)**2<(bo.r+b.r)**2){
          bo.hp-=b.dmg;
          reportBossDamage(bo.zoneId, b.dmg);
          if(b.isCrit) dmgTexts.push({x:bo.x+(Math.random()-0.5)*40,y:bo.y-bo.r,text:t('crit')+' '+Math.round(b.dmg),life:50,color:'#ff0',vy:-1.5,size:24});
          else dmgTexts.push({x:bo.x+(Math.random()-0.5)*40,y:bo.y-bo.r,text:Math.round(b.dmg),life:40,color:'#ff0',vy:-1});
          if(bo.hp<=0) killBoss(bo);
          hit=true; break;
        }
      }
    }
    if(hit||b.life<=0) bullets.splice(i,1);
  }

  // enemy bullets
  for(let i=enemyBullets.length-1;i>=0;i--){
    const b=enemyBullets[i];
    b.x+=b.vx; b.y+=b.vy;
    if(player.invuln<=0 && (b.x-player.x)**2+(b.y-player.y)**2<(b.r+player.r)**2){ onPlayerHit(b.dmg); enemyBullets.splice(i,1); continue; }
    if(b.x<0||b.x>WORLD_W||b.y<0||b.y>WORLD_H) enemyBullets.splice(i,1);
  }

  // xp orbs
  for(let i=xpOrbs.length-1;i>=0;i--){
    const o=xpOrbs[i];
    const dx=player.x-o.x, dy=player.y-o.y, d=Math.hypot(dx,dy)||1;
    if(d<320){ o.x+=dx/d*9; o.y+=dy/d*9; }
    if(d<25){ player.xp+=o.xp; xpOrbs.splice(i,1); while(player.xp>=player.xpNext) levelUp(); }
  }

  // particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vx*=0.95; p.vy*=0.95; p.life--;
    if(p.life<=0) particles.splice(i,1);
  }
  for(let i=dmgTexts.length-1;i>=0;i--){ const d=dmgTexts[i]; d.y+=d.vy; d.life--; if(d.life<=0) dmgTexts.splice(i,1); }

  // bomb effects
  for(let i=bombEffects.length-1;i>=0;i--){
    const be=bombEffects[i];
    be.radius += be.type==='nuke' ? 25 : 18;
    be.alpha -= be.type==='nuke' ? 0.012 : 0.025;
    if(be.alpha<=0 || be.radius>be.maxRadius) bombEffects.splice(i,1);
  }

  // bosses
  for(const bo of bosses){
    if(!bo.alive) continue;
    if(lobby.bossHp && lobby.bossHp[bo.zoneId]!==undefined){
      const srvHp = lobby.bossHp[bo.zoneId];
      const pending = pendingBossDmg[bo.zoneId]||0;
      const effective = Math.max(0, srvHp-pending);
      if(effective < bo.hp) bo.hp = effective;
      if(srvHp<=0 && pending===0 && bo.hp>0){ bo.hp=0; if(bo.alive) killBoss(bo); }
    }
    if(bo.hp<bo.maxHp*0.25 && !bo.rage){ bo.rage = true; flash = 0.5; flashColor = bo.color; }
    const dx=player.x-bo.x, dy=player.y-bo.y, d=Math.hypot(dx,dy)||1;
    bo.active = d<1300;
    if(!bo.active) continue;
    const rageMult = bo.rage ? 1.5 : 1;
    if(d>bo.r+player.r+50){ bo.x += dx/d*bo.speed*rageMult; bo.y += dy/d*bo.speed*rageMult; }
    if(d<bo.r+player.r && player.invuln<=0) onPlayerHit(bo.dmg);
    if(bo.atkCd>0) bo.atkCd--;
    else{
      const n = (10 + bo.phase*4) * (bo.rage?2:1);
      for(let i=0;i<n;i++){
        const ang=(i/n)*Math.PI*2 + time*0.3;
        enemyBullets.push({x:bo.x,y:bo.y,vx:Math.cos(ang)*4*rageMult,vy:Math.sin(ang)*4*rageMult,r:9,dmg:bo.dmg*0.6,color:bo.color});
      }
      const ang=Math.atan2(dy,dx);
      enemyBullets.push({x:bo.x,y:bo.y,vx:Math.cos(ang)*7,vy:Math.sin(ang)*7,r:11,dmg:bo.dmg,color:'#fff'});
      bo.atkCd = Math.max(40, (100 - bo.phase*10) / rageMult);
      if(Math.random()<0.1) bo.phase=Math.min(3,bo.phase+1);
    }
  }

  if(player.hp<=0){
    player.hp=0;
    for(let i=0;i<60;i++){ const ang = Math.random()*Math.PI*2; particles.push({x:player.x,y:player.y,vx:Math.cos(ang)*15,vy:Math.sin(ang)*15,life:50,color:'#f00',r:4+Math.random()*5}); }
    endGame(false);
  }

  // embers
  for(const e of EMBERS){
    e.x += e.vx*(1/60); e.y += e.vy*(1/60); e.life += 1/60;
    if(e.life>e.maxLife || e.y<-20){
      e.x = Math.random()*W; e.y = H+10;
      e.vx = (Math.random()-0.5)*30; e.vy = -30-Math.random()*50;
      e.life = 0; e.maxLife = 3+Math.random()*4;
      e.size = 0.5+Math.random()*2.5;
      e.color = Math.random()<0.4?'#ffff44':(Math.random()<0.5?'#ff8800':'#ff2200');
    }
  }
}

// ============================================================
// UPDATE — POCKET
// ============================================================
function updatePocket(){
  pocket.time += 1/60;
  if(shake>0){ shake *= 0.9; if(shake<0.5) shake=0; }
  if(flash>0) flash -= 0.02;
  if(exitCooldown>0) exitCooldown--;

  MusicMgr.tick();
  movePlayerGeneric(pocket.size, pocket.size);

  const tcx=Math.max(0,Math.min(pocket.size-W,player.x-W/2));
  const tcy=Math.max(0,Math.min(pocket.size-H,player.y-H/2));
  camX+=(tcx-camX)*0.15;
  camY+=(tcy-camY)*0.15;

  // exit portal
  const exitX = pocket.size / 2;
  const exitY = pocket.size / 2 - 100;
  if(exitCooldown<=0 && Math.hypot(player.x - exitX, player.y - exitY) < 60){
    exitPocket();
    return;
  }

  if(pocket.theme === 'chaos'){
    // speakers fire
    for(const sp of pocket.speakers){
      sp.beamTimer--;
      if(sp.beamTimer <= 0){
        pocket.lightning.push({
          x1: sp.x + sp.w/2,
          y1: sp.y + sp.h/2,
          x2: player.x + (Math.random() - 0.5) * 500,
          y2: player.y + (Math.random() - 0.5) * 500,
          life: 10,
          maxLife: 10,
          color: sp.color
        });
        sp.beamTimer = 25 + Math.random() * 50;
      }
    }
    for(let i=pocket.lightning.length-1;i>=0;i--){
      pocket.lightning[i].life--;
      if(pocket.lightning[i].life <= 0) pocket.lightning.splice(i, 1);
    }
    // texts
    for(const tx of pocket.texts){
      tx.x += tx.vx; tx.y += tx.vy;
      tx.rot += tx.rotSpeed;
      tx.wobble += 0.05;
      if(tx.x < 0 || tx.x > pocket.size) tx.vx *= -1;
      if(tx.y < 0 || tx.y > pocket.size) tx.vy *= -1;
    }
    // balls
    for(const b of pocket.entities){
      b.x += b.vx; b.y += b.vy; b.angle += b.spin;
      if(b.x - b.r < 0 || b.x + b.r > pocket.size) b.vx *= -1;
      if(b.y - b.r < 0 || b.y + b.r > pocket.size) b.vy *= -1;
    }
    // ambient explosions
    if(Math.random() < 0.4){
      const colors = ['#f00','#0f0','#00f','#ff0','#f0f','#0ff'];
      pocket.particles.push({
        x: camX + Math.random() * W,
        y: camY + Math.random() * H,
        vx: (Math.random()-0.5) * 12,
        vy: (Math.random()-0.5) * 12,
        life: 40, maxLife: 40,
        color: colors[Math.floor(Math.random()*colors.length)],
        size: 4 + Math.random() * 10
      });
    }
    // cap particles
    while(pocket.particles.length > 500) pocket.particles.shift();
  } else if(pocket.theme === 'happy'){
    for(const e of pocket.entities){
      e.x += e.vx; e.y += e.vy;
      e.wobble += e.wobbleSpeed;
      e.x += Math.sin(e.wobble) * 0.6;
      if(e.y < -50){ e.y = pocket.size + 50; e.x = Math.random() * pocket.size; }
      if(e.x < -50) e.x = pocket.size + 50;
      if(e.x > pocket.size + 50) e.x = -50;
    }
  } else if(pocket.theme === 'sad'){
    for(const e of pocket.entities){
      if(e.type === 'raindrop'){
        e.y += e.vy;
        if(e.y > pocket.size){ e.y = -20; e.x = Math.random() * pocket.size; }
      }
    }
  }

  // particle physics
  for(let i=pocket.particles.length-1;i>=0;i--){
    const p = pocket.particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.96; p.vy *= 0.96;
    p.life--;
    if(p.life<=0) pocket.particles.splice(i,1);
  }
}

// ============================================================
// DRAW HELPERS
// ============================================================
function drawLightning(x1, y1, x2, y2, segments, color, alpha){
  ctx.save();
  ctx.globalAlpha = Math.min(1, alpha);
  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.shadowBlur = 15;
  ctx.shadowColor = color;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  for(let i=1;i<segments;i++){
    const t = i / segments;
    const tx = x1 + (x2 - x1) * t + (Math.random() - 0.5) * 50;
    const ty = y1 + (y2 - y1) * t + (Math.random() - 0.5) * 50;
    ctx.lineTo(tx, ty);
  }
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.restore();
}

function drawGround(){
  const zone = ZONES[currentZoneIdx()];
  ctx.fillStyle = '#050000';
  ctx.fillRect(0, 0, W, H);

  const startTX = Math.floor(camX / TILE_SIZE);
  const startTY = Math.floor(camY / TILE_SIZE);
  const endTX = Math.ceil((camX + W) / TILE_SIZE);
  const endTY = Math.ceil((camY + H) / TILE_SIZE);

  for(let tx=startTX; tx<=endTX; tx++){
    for(let ty=startTY; ty<=endTY; ty++){
      const sx = tx*TILE_SIZE - camX;
      const sy = ty*TILE_SIZE - camY;
      const hash = ((tx*73856093) ^ (ty*19349663)) & 3;
      const tile = hellTiles[hash];
      if(tile) ctx.drawImage(tile, sx, sy, TILE_SIZE, TILE_SIZE);
    }
  }
  ctx.fillStyle = zone.tint;
  ctx.fillRect(0, 0, W, H);
}

function drawDecorations(){
  const vL = camX-150, vR = camX+W+150, vT = camY-150, vB = camY+H+150;

  for(const d of DECORATIONS){
    if(d.x < vL || d.x > vR || d.y < vT || d.y > vB) continue;
    const sx = d.x - camX, sy = d.y - camY;

    if(d.type === 'skull'){
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(d.rot);
      ctx.fillStyle = 'rgba(200,190,170,0.6)';
      ctx.beginPath(); ctx.arc(0, 0, d.size, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(20,10,5,0.9)';
      ctx.beginPath(); ctx.arc(-d.size*0.4, -d.size*0.2, d.size*0.3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(d.size*0.4, -d.size*0.2, d.size*0.3, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    } else if(d.type === 'pillar'){
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(d.tilt);
      ctx.fillStyle = 'rgba(30,15,10,0.85)';
      ctx.fillRect(-d.size/2, -d.size*2, d.size, d.size*2);
      ctx.fillStyle = 'rgba(60,30,20,0.7)';
      ctx.fillRect(-d.size/2, -d.size*2, d.size*0.3, d.size*2);
      ctx.restore();
    } else if(d.type === 'torii'){
      ctx.save(); ctx.translate(sx, sy);
      const s = d.size;
      ctx.fillStyle = 'rgba(150,20,10,0.85)';
      ctx.fillRect(-s*0.8, -s*1.5, s*0.15, s*1.7);
      ctx.fillRect(s*0.65, -s*1.5, s*0.15, s*1.7);
      ctx.fillRect(-s*0.9, -s*1.5, s*1.8, s*0.2);
      ctx.fillRect(-s*0.75, -s*1.1, s*1.5, s*0.1);
      ctx.restore();
    } else if(d.type === 'kanji_stone'){
      ctx.save(); ctx.translate(sx, sy);
      ctx.fillStyle = 'rgba(20,10,5,0.7)';
      ctx.fillRect(-d.size*0.7, -d.size, d.size*1.4, d.size*2);
      ctx.fillStyle = 'rgba(255,50,20,0.6)';
      ctx.font = `bold ${d.size}px "Noto Sans CJK SC", sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(KANJI[d.idx], 0, 0);
      ctx.restore();
    } else if(d.type === 'chain'){
      ctx.save(); ctx.translate(sx, sy);
      ctx.strokeStyle = 'rgba(80,60,50,0.7)';
      ctx.lineWidth = 3;
      for(let i=0;i<4;i++){
        ctx.beginPath();
        ctx.ellipse(-d.size*0.6+i*d.size*0.4, 0, d.size*0.25, d.size*0.15, 0, 0, Math.PI*2);
        ctx.stroke();
      }
      ctx.restore();
    } else if(d.type === 'brazier'){
      const flicker = 1 + Math.sin(time*10 + d.phase)*0.3;
      ctx.fillStyle = 'rgba(40,20,10,0.9)';
      ctx.fillRect(sx-d.size*0.15, sy, d.size*0.3, d.size);
      ctx.fillStyle = 'rgba(60,30,20,0.95)';
      ctx.beginPath();
      ctx.ellipse(sx, sy, d.size*0.5, d.size*0.15, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const flameGrd = ctx.createRadialGradient(sx, sy-d.size*0.3, 0, sx, sy-d.size*0.3, d.size*0.9*flicker);
      flameGrd.addColorStop(0, 'rgba(255,255,200,0.9)');
      flameGrd.addColorStop(0.3, 'rgba(255,200,50,0.7)');
      flameGrd.addColorStop(0.7, 'rgba(255,80,0,0.4)');
      flameGrd.addColorStop(1, 'rgba(255,0,0,0)');
      ctx.fillStyle = flameGrd;
      ctx.beginPath();
      ctx.ellipse(sx, sy-d.size*0.3, d.size*0.9*flicker, d.size*1.3*flicker, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    } else if(d.type === 'lava'){
      const pulseR = d.r * (1 + Math.sin(time*2 + d.phase)*0.1);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const grd = ctx.createRadialGradient(sx, sy, 0, sx, sy, pulseR*1.3);
      grd.addColorStop(0, 'rgba(255,200,50,0.7)');
      grd.addColorStop(0.4, 'rgba(255,80,0,0.5)');
      grd.addColorStop(0.8, 'rgba(180,20,0,0.3)');
      grd.addColorStop(1, 'rgba(80,0,0,0)');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(sx, sy, pulseR*1.3, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }
}

function drawDoors(){
  for(const door of doors){
    const sx = door.x - camX, sy = door.y - camY;
    if(sx < -150 || sx > W+150 || sy < -150 || sy > H+150) continue;
    door.phase += 0.05;
    const glow = 1 + Math.sin(door.phase) * 0.15;

    let color;
    if(door.theme === 'happy') color = '#ff44aa';
    else if(door.theme === 'sad') color = '#4444ff';
    else color = `hsl(${(door.phase * 60) % 360}, 100%, 60%)`;

    ctx.save();
    ctx.translate(sx, sy);
    ctx.shadowBlur = 40;
    ctx.shadowColor = color;

    const grd = ctx.createRadialGradient(0, 0, 0, 0, 0, door.r * glow * 1.5);
    grd.addColorStop(0, color);
    grd.addColorStop(0.5, color.replace(')', ',0.5)').replace('hsl', 'hsla').replace('rgb','rgba'));
    grd.addColorStop(1, 'transparent');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(0, 0, door.r * glow * 1.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = color;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(0, 0, door.r * glow, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, door.r * glow * 0.7, 0, Math.PI * 2);
    ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 32px Impact, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('?', 0, 0);
    ctx.restore();
  }
}

function drawEmbers(){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(const e of EMBERS){
    const alpha = Math.sin((e.life/e.maxLife)*Math.PI) * 0.9;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = e.color;
    ctx.shadowBlur = 8;
    ctx.shadowColor = e.color;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.size, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawVignette(){
  const grd = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.35, W/2, H/2, Math.max(W,H)*0.7);
  grd.addColorStop(0, 'rgba(0,0,0,0)');
  grd.addColorStop(1, 'rgba(0,0,0,0.7)');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  if(player && player.hp > 0){
    const hpPct = player.hp/player.maxHp;
    if(hpPct < 0.4){
      const intensity = (1 - hpPct/0.4) * 0.5;
      const pulse = Math.sin(performance.now()/300)*0.2 + 0.8;
      const redGrd = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.2, W/2, H/2, Math.max(W,H)*0.7);
      redGrd.addColorStop(0, 'rgba(0,0,0,0)');
      redGrd.addColorStop(1, `rgba(150,0,0,${intensity*pulse})`);
      ctx.fillStyle = redGrd;
      ctx.fillRect(0, 0, W, H);
    }
  }
}

function drawBombEffects(){
  for(const be of bombEffects){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = be.alpha;
    const sx = be.x - camX, sy = be.y - camY;
    if(be.type === 'nuke'){
      const grd = ctx.createRadialGradient(sx, sy, 0, sx, sy, be.radius);
      grd.addColorStop(0, 'rgba(255,255,255,0.95)');
      grd.addColorStop(0.2, 'rgba(255,255,150,0.85)');
      grd.addColorStop(0.5, 'rgba(255,200,0,0.6)');
      grd.addColorStop(0.8, 'rgba(255,50,0,0.35)');
      grd.addColorStop(1, 'rgba(255,0,0,0)');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(sx, sy, be.radius, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = `rgba(255,255,255,${be.alpha})`;
      ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(sx, sy, be.radius*0.95, 0, Math.PI*2); ctx.stroke();
    } else {
      const grd = ctx.createRadialGradient(sx, sy, 0, sx, sy, be.radius);
      grd.addColorStop(0, 'rgba(255,50,0,0.9)');
      grd.addColorStop(0.5, 'rgba(255,0,0,0.5)');
      grd.addColorStop(1, 'rgba(150,0,0,0)');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(sx, sy, be.radius, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

function drawPlayerAt(x, y, color, isMe, hpPct, name){
  ctx.save();
  ctx.translate(x, y);
  if(isMe && player.invuln>0 && Math.floor(performance.now()/80)%2===0) ctx.globalAlpha = 0.4;

  const glowGrd = ctx.createRadialGradient(0,0,0,0,0,32);
  glowGrd.addColorStop(0, color || 'rgba(255,0,0,0.5)');
  glowGrd.addColorStop(1, 'rgba(255,0,0,0)');
  ctx.fillStyle = glowGrd;
  ctx.beginPath(); ctx.arc(0,0,32,0,Math.PI*2); ctx.fill();

  ctx.fillStyle = color || '#8B0000';
  ctx.beginPath(); ctx.arc(0,0,16,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.arc(0,0,11,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-5,-3,3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(5,-3,3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#f00';
  ctx.beginPath(); ctx.arc(-5,-3,1.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(5,-3,1.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ff0';
  ctx.fillRect(-4, -26, 8, 14);
  ctx.fillStyle = '#f00';
  ctx.font = 'bold 8px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('咒', 0, -17);

  if(name){
    ctx.fillStyle = color || '#fff';
    ctx.font = 'bold 11px monospace';
    ctx.fillText(name, 0, -42);
    if(hpPct !== undefined && hpPct < 1){
      ctx.fillStyle = '#000'; ctx.fillRect(-25, -38, 50, 4);
      ctx.fillStyle = '#f00'; ctx.fillRect(-25, -38, 50*Math.max(0,hpPct), 4);
    }
  }
  ctx.restore();
}

function drawEnemy(e){
  const sx=e.x-camX, sy=e.y-camY;
  ctx.save();
  ctx.translate(sx, sy);
  if(e.type==='jiangshi'){
    ctx.fillStyle=e.color;
    ctx.beginPath(); ctx.arc(0,0,e.r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#f00'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(-4,-3,2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(4,-3,2,0,Math.PI*2); ctx.fill();
  } else if(e.type==='spirit'){
    ctx.shadowBlur=20; ctx.shadowColor=e.color;
    ctx.fillStyle=e.color;
    ctx.beginPath(); ctx.arc(0,0,e.r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(-3,-2,2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(3,-2,2,0,Math.PI*2); ctx.fill();
  } else if(e.type==='exploder'){
    ctx.shadowBlur=15; ctx.shadowColor='#ff0';
    ctx.fillStyle=e.color;
    ctx.beginPath(); ctx.arc(0,0,e.r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle='#f00'; ctx.lineWidth=3; ctx.stroke();
    ctx.fillStyle='#f00';
    ctx.font='bold 16px monospace'; ctx.textAlign='center';
    ctx.fillText('!', 0, 5);
  } else {
    ctx.fillStyle=e.color;
    ctx.beginPath(); ctx.arc(0,0,e.r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#f00'; ctx.lineWidth=3; ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(-7,-5,4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(7,-5,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath(); ctx.arc(-7,-5,2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(7,-5,2,0,Math.PI*2); ctx.fill();
  }
  if(e.hp<e.maxHp){
    const w=e.r*2;
    ctx.fillStyle='#000'; ctx.fillRect(-w/2,-e.r-12,w,4);
    ctx.fillStyle='#f00'; ctx.fillRect(-w/2,-e.r-12,w*(e.hp/e.maxHp),4);
  }
  ctx.restore();
}

function drawBoss(bo){
  const sx=bo.x-camX, sy=bo.y-camY;
  ctx.save();
  ctx.translate(sx, sy);
  const pulse = 1 + Math.sin(time*4) * 0.05;
  ctx.scale(pulse, pulse);

  if(bo.rage){
    ctx.shadowBlur=60; ctx.shadowColor=bo.color;
    const auraR = bo.r * (1.2 + Math.sin(time*8)*0.1);
    const ag = ctx.createRadialGradient(0,0,bo.r*0.5,0,0,auraR*1.4);
    ag.addColorStop(0, bo.color + '66');
    ag.addColorStop(1, 'transparent');
    ctx.fillStyle = ag;
    ctx.beginPath(); ctx.arc(0,0,auraR*1.4,0,Math.PI*2); ctx.fill();
  }

  const img = bossImages[bo.zoneId-1];
  if(img && img.complete && img.naturalWidth>0){
    ctx.drawImage(img, -bo.r, -bo.r, bo.r*2, bo.r*2);
    ctx.strokeStyle = bo.color; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 0, bo.r+6, 0, Math.PI*2); ctx.stroke();
  } else {
    ctx.shadowBlur=40; ctx.shadowColor=bo.color;
    ctx.fillStyle=bo.color;
    ctx.beginPath(); ctx.arc(0,0,bo.r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle='#fff'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(0,0,bo.r+8,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(-bo.r*0.3,-bo.r*0.15,bo.r*0.15,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc( bo.r*0.3,-bo.r*0.15,bo.r*0.15,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath(); ctx.arc(-bo.r*0.3,-bo.r*0.15,bo.r*0.07,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc( bo.r*0.3,-bo.r*0.15,bo.r*0.07,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();

  ctx.save();
  ctx.fillStyle = bo.rage ? '#ff0' : '#fff';
  ctx.font = 'bold 18px Impact,sans-serif';
  ctx.textAlign = 'center';
  ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
  ctx.strokeText(bo.name, sx, sy-bo.r-20);
  ctx.fillText(bo.name, sx, sy-bo.r-20);
  ctx.restore();
}

// HUD
// ============================================================
function uiScale(){ return Math.max(0.8, Math.min(1.4, Math.min(W/1280, H/720))); }

function drawHUD(){
  const s = uiScale();
  ctx.save();

  // HP
  const hpW = 300*s, hpH = 22*s;
  const x0 = 20*s, y0 = 20*s;
  ctx.fillStyle='rgba(0,0,0,0.75)'; ctx.fillRect(x0,y0,hpW+4,hpH+4);
  ctx.fillStyle='#500'; ctx.fillRect(x0+2,y0+2,hpW,hpH);
  ctx.fillStyle = player.hp > player.maxHp*0.3 ? '#f00' : '#ff0';
  ctx.fillRect(x0+2,y0+2,hpW*Math.max(0,player.hp/player.maxHp),hpH);
  ctx.strokeStyle='#f00'; ctx.lineWidth=2; ctx.strokeRect(x0,y0,hpW+4,hpH+4);
  ctx.fillStyle='#fff'; ctx.font=`bold ${14*s}px monospace`; ctx.textAlign='center';
  ctx.fillText(`${t('hp')} ${Math.ceil(player.hp)}/${player.maxHp}`,x0+hpW/2,y0+16*s);

  // XP
  ctx.fillStyle='rgba(0,0,0,0.75)'; ctx.fillRect(x0,y0+30*s,hpW+4,14*s);
  ctx.fillStyle='#003'; ctx.fillRect(x0+2,y0+32*s,hpW,10*s);
  ctx.fillStyle='#0af'; ctx.fillRect(x0+2,y0+32*s,hpW*(player.xp/player.xpNext),10*s);
  ctx.strokeStyle='#0af'; ctx.lineWidth=1; ctx.strokeRect(x0,y0+30*s,hpW+4,14*s);

  // Level
  ctx.fillStyle='#ff0'; ctx.font=`bold ${28*s}px Impact,sans-serif`; ctx.textAlign='left';
  ctx.fillText(`LV ${player.level}`,x0,y0+80*s);
  ctx.fillStyle='#fff'; ctx.font=`bold ${15*s}px monospace`;
  ctx.fillText(`${t('kills')}: ${kills}`,x0+130*s,y0+70*s);
  ctx.fillText(`${t('bosses')}: ${bossesKilled}/10`,x0+130*s,y0+92*s);
  ctx.fillText(`${t('time')}: ${time.toFixed(1)}s`,x0+130*s,y0+114*s);
  ctx.fillStyle='#f0f'; ctx.font=`bold ${18*s}px monospace`;
  ctx.fillText(`💣 ${player.bombs} [X]`,x0,y0+110*s);

  // Combo
  if(combo >= 3){
    const pulse = 1 + Math.sin(time*8)*0.1;
    ctx.save();
    ctx.translate(W/2, 130*s);
    ctx.scale(pulse, pulse);
    ctx.fillStyle = combo>=30?'#ff0':combo>=15?'#f80':'#f0f';
    ctx.font = `bold ${32*s}px Impact,sans-serif`;
    ctx.textAlign = 'center';
    ctx.strokeStyle='#000'; ctx.lineWidth=4;
    ctx.strokeText(`${t('combo')} x${combo}`, 0, 0);
    ctx.fillText(`${t('combo')} x${combo}`, 0, 0);
    ctx.restore();
  }

  // Zone
  const zone = ZONES[currentZoneIdx()];
  ctx.fillStyle = zone.bossColor;
  ctx.font = `bold ${20*s}px Impact,sans-serif`;
  ctx.textAlign = 'center';
  ctx.shadowBlur = 10; ctx.shadowColor = zone.bossColor;
  ctx.fillText(`ZONE ${zone.id}`, W/2, 40*s);
  ctx.shadowBlur = 0;

  // Boss bars
  let yOff = 60*s;
  for(const bo of bosses){
    if(!bo.alive||!bo.active) continue;
    const bw = 320*s, bh = 20*s;
    ctx.fillStyle='rgba(0,0,0,0.75)'; ctx.fillRect(W/2-bw/2,yOff,bw,bh);
    ctx.fillStyle='#400'; ctx.fillRect(W/2-bw/2+2,yOff+2,bw-4,bh-4);
    ctx.fillStyle = bo.rage ? '#ff0' : bo.color;
    ctx.fillRect(W/2-bw/2+2,yOff+2,(bw-4)*(bo.hp/bo.maxHp),bh-4);
    ctx.strokeStyle = bo.rage ? '#ff0' : bo.color;
    ctx.lineWidth=2; ctx.strokeRect(W/2-bw/2,yOff,bw,bh);
    ctx.fillStyle='#fff'; ctx.font=`bold ${12*s}px monospace`;
    ctx.fillText(bo.name + (bo.rage?' [RAGE]':''),W/2,yOff+bh-4);
    yOff += bh+8;
  }

  // Off-screen arrows
  for(const bo of bosses){
    if(!bo.alive||bo.active) continue;
    const dx=bo.x-player.x, dy=bo.y-player.y;
    const ang=Math.atan2(dy,dx);
    const radius=Math.min(W,H)*0.42;
    const px=W/2+Math.cos(ang)*radius;
    const py=H/2+Math.sin(ang)*radius;
    ctx.save();
    ctx.translate(px,py); ctx.rotate(ang);
    ctx.fillStyle=bo.color;
    ctx.shadowBlur=10; ctx.shadowColor=bo.color;
    ctx.beginPath(); ctx.moveTo(15,0); ctx.lineTo(-10,-10); ctx.lineTo(-10,10); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // Online
  ctx.textAlign='right';
  ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(W-180*s,60*s,170*s,44*s);
  ctx.strokeStyle = onlineStatus==='ok'?'#0f0':onlineStatus==='error'?'#f00':'#666';
  ctx.lineWidth=2; ctx.strokeRect(W-180*s,60*s,170*s,44*s);
  ctx.fillStyle = onlineStatus==='ok'?'#0f0':onlineStatus==='error'?'#f00':'#666';
  ctx.font=`bold ${14*s}px monospace`;
  ctx.fillText(`🌐 ${t('online')}: ${onlinePlayers.length+1}`,W-15*s,80*s);
  ctx.fillStyle='#fff'; ctx.font=`${11*s}px monospace`;
  ctx.fillText(`ID: ${clientId.slice(0,6)}`,W-15*s,96*s);

  // Language
  ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(W-90*s,20*s,70*s,32*s);
  ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.strokeRect(W-90*s,20*s,70*s,32*s);
  ctx.fillStyle='#fff'; ctx.font=`bold ${16*s}px monospace`; ctx.textAlign='center';
  ctx.fillText(lang.toUpperCase(),W-55*s,42*s);

  if(cheatCrazygun && crazygunFlashTimer > 0){
    ctx.save();
    ctx.globalAlpha = crazygunFlashTimer/30;
    ctx.fillStyle = `hsl(${(performance.now()/5)%360},100%,50%)`;
    ctx.font = `bold ${60*s}px Impact,sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(t('crazy'), W/2, H/2 - 100*s);
    ctx.restore();
  }

  if(isMobile){
    ctx.fillStyle='rgba(255,0,255,0.4)';
    ctx.beginPath(); ctx.arc(W-70*s,H-70*s,45*s,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#f0f'; ctx.lineWidth=4; ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font=`bold ${30*s}px Arial`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(cheatCrazygun?'☢':'💣',W-70*s,H-70*s);
    ctx.textBaseline='alphabetic';
  }

  if(!isMobile){
    ctx.fillStyle=mouseControlEnabled?'#0f0':'#666';
    ctx.font=`bold ${12*s}px monospace`; ctx.textAlign='left';
    ctx.fillText(mouseControlEnabled?'🖱 MOUSE: ON':'⌨ KEYBOARD',20*s,H-20*s);
  }

  if(cheatCrazygun){
    ctx.fillStyle='#f0f';
    ctx.font=`bold ${14*s}px monospace`; ctx.textAlign='right';
    ctx.fillText('☢ CRAZYGUN ACTIVE', W-20*s, H-40*s);
  }

  ctx.restore();
}

// ============================================================
// POCKET RENDER
// ============================================================
function drawPocket(){
  // Background
  if(pocket.theme === 'happy'){
    const grd = ctx.createLinearGradient(0, 0, 0, H);
    grd.addColorStop(0, '#ffccff');
    grd.addColorStop(0.5, '#ffddaa');
    grd.addColorStop(1, '#ffffaa');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);
  } else if(pocket.theme === 'sad'){
    const grd = ctx.createLinearGradient(0, 0, 0, H);
    grd.addColorStop(0, '#1a1a3a');
    grd.addColorStop(1, '#0a0a1a');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);
  } else if(pocket.theme === 'chaos'){
    const hue = (pocket.time * 200) % 360;
    ctx.fillStyle = `hsl(${hue}, 100%, 15%)`;
    ctx.fillRect(0, 0, W, H);
    for(let i = 0; i < 12; i++){
      ctx.globalAlpha = 0.15 + Math.random() * 0.2;
      ctx.fillStyle = `hsl(${Math.random()*360}, 100%, 55%)`;
      ctx.fillRect(Math.random()*W, Math.random()*H, 100 + Math.random()*400, 100 + Math.random()*400);
    }
    ctx.globalAlpha = 1;
  }

  ctx.save();
  ctx.translate(-camX, -camY);

  // bounds
  ctx.strokeStyle = pocket.theme === 'happy' ? '#fff' : pocket.theme === 'sad' ? '#4a5a8a' : '#f0f';
  ctx.lineWidth = 8;
  ctx.strokeRect(0, 0, pocket.size, pocket.size);

  // draw entities
  if(pocket.theme === 'happy'){
    for(const e of pocket.entities){
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.fillStyle = e.color;
      ctx.font = `${e.size}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if(e.type === 'heart') ctx.fillText('❤', 0, 0);
      else if(e.type === 'butterfly') ctx.fillText('🦋', 0, 0);
      else if(e.type === 'flower') ctx.fillText('🌸', 0, 0);
      else ctx.fillText('⭐', 0, 0);
      ctx.restore();
    }
  } else if(pocket.theme === 'sad'){
    for(const e of pocket.entities){
      if(e.type === 'raindrop'){
        ctx.fillStyle = e.color;
        ctx.fillRect(e.x, e.y, 2, 10);
      } else if(e.type === 'grave'){
        ctx.fillStyle = e.color;
        ctx.fillRect(e.x - e.size/2, e.y - e.size, e.size, e.size);
        ctx.fillStyle = '#888';
        ctx.beginPath();
        ctx.arc(e.x, e.y - e.size, e.size/2, Math.PI, 0);
        ctx.fill();
        ctx.fillStyle = '#555';
        ctx.font = 'bold 20px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('RIP', e.x, e.y - e.size/2);
      }
    }
  } else if(pocket.theme === 'chaos'){
    // speakers
    for(const sp of pocket.speakers){
      ctx.save();
      ctx.translate(sp.x, sp.y);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, sp.w, sp.h);
      ctx.strokeStyle = sp.color;
      ctx.lineWidth = 4;
      ctx.shadowBlur = 20;
      ctx.shadowColor = sp.color;
      ctx.strokeRect(0, 0, sp.w, sp.h);
      ctx.shadowBlur = 0;
      // cones
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(sp.w/2, sp.h*0.35, sp.w*0.3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(sp.w/2, sp.h*0.72, sp.w*0.2, 0, Math.PI*2); ctx.fill();
      // pulsing
      ctx.strokeStyle = sp.color;
      ctx.globalAlpha = 0.4 + Math.sin(pocket.time * 12) * 0.4;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(sp.w/2, sp.h*0.35, sp.w*0.35, 0, Math.PI*2); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    // lightning
    for(const l of pocket.lightning){
      drawLightning(l.x1, l.y1, l.x2, l.y2, 7, l.color, l.life / l.maxLife);
    }

    // rotating balls
    for(const b of pocket.entities){
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.angle);
      ctx.shadowBlur = 30;
      ctx.shadowColor = b.color;
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(0, 0, b.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, b.r * 0.7, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = b.color;
      ctx.lineWidth = 2;
      for(let i = 0; i < 6; i++){
        const a = (i / 6) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a) * b.r, Math.sin(a) * b.r);
        ctx.stroke();
      }
      ctx.restore();
    }

    // particles
    for(const p of pocket.particles){
      ctx.globalAlpha = p.life / p.maxLife;
      ctx.fillStyle = p.color;
      ctx.shadowBlur = 15;
      ctx.shadowColor = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    // texts
    for(const tx of pocket.texts){
      ctx.save();
      ctx.translate(tx.x, tx.y);
      ctx.rotate(tx.rot + Math.sin(tx.wobble) * 0.2);
      ctx.font = `bold ${tx.size}px Impact, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 4;
      ctx.strokeText(tx.text, 0, 0);
      ctx.fillStyle = tx.color;
      ctx.fillText(tx.text, 0, 0);
      ctx.restore();
    }
  }

  // Exit portal
  const exitX = pocket.size / 2;
  const exitY = pocket.size / 2 - 100;
  const exitGlow = 1 + Math.sin(pocket.time * 4) * 0.1;
  ctx.save();
  ctx.translate(exitX, exitY);
  ctx.shadowBlur = 50;
  ctx.shadowColor = '#0ff';
  const grd2 = ctx.createRadialGradient(0, 0, 0, 0, 0, 60 * exitGlow);
  grd2.addColorStop(0, 'rgba(0, 255, 255, 0.9)');
  grd2.addColorStop(1, 'rgba(0, 255, 255, 0)');
  ctx.fillStyle = grd2;
  ctx.beginPath(); ctx.arc(0, 0, 60 * exitGlow, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(0, 0, 50 * exitGlow, 0, Math.PI * 2); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(t('return'), 0, 0);
  ctx.restore();

  // player
  drawPlayerAt(player.x, player.y, myColor, true, player.hp/player.maxHp, currentUser||'You');

  ctx.restore();

  // theme label
  ctx.save();
  ctx.fillStyle = pocket.theme === 'happy' ? '#f0f' : pocket.theme === 'sad' ? '#48f' : `hsl(${(pocket.time*180)%360},100%,60%)`;
  ctx.font = 'bold 28px Impact, sans-serif';
  ctx.textAlign = 'center';
  ctx.shadowBlur = 20;
  ctx.shadowColor = ctx.fillStyle;
  let label = pocket.theme === 'happy' ? '☀ HAPPY ☀' : pocket.theme === 'sad' ? '☂ SAD ☂' : '⚠ CHAOS WTF ⚠';
  ctx.fillText(label, W/2, 40);
  ctx.shadowBlur = 0;
  ctx.restore();

  // chaos post-effects
  if(pocket.theme === 'chaos'){
    // glitch slices
    glitchCtx.drawImage(canvas, 0, 0);
    const slices = 3 + Math.floor(Math.random() * 3);
    for(let i = 0; i < slices; i++){
      const sy = Math.random() * H;
      const sh = 20 + Math.random() * 100;
      const dx = (Math.random() - 0.5) * 80;
      ctx.drawImage(glitchCanvas, 0, sy, W, sh, dx, sy, W, sh);
    }
    // random color overlay
    if(Math.random() < 0.3){
      ctx.fillStyle = `hsla(${Math.random()*360},100%,50%,${Math.random()*0.15})`;
      ctx.fillRect(0, 0, W, H);
    }
    // screen wobble
    if(Math.random() < 0.15){
      const ang = (Math.random() - 0.5) * 0.02;
      ctx.save();
      ctx.translate(W/2, H/2);
      ctx.rotate(ang);
      ctx.translate(-W/2, -H/2);
      ctx.restore();
    }
  }
}

function drawMenuBg(){
  const grd = ctx.createRadialGradient(W/2, H*0.4, 50, W/2, H*0.7, W*0.9);
  grd.addColorStop(0, '#3a0000');
  grd.addColorStop(0.5, '#150000');
  grd.addColorStop(1, '#000');
  ctx.fillStyle = grd;
  ctx.fillRect(0,0,W,H);

  ctx.globalAlpha = 0.25;
  ctx.font = 'bold 50px "Noto Sans CJK SC", sans-serif';
  ctx.fillStyle = '#f00';
  ctx.textAlign = 'center';
  for(let i=0;i<30;i++){
    const x = (i*163 + Math.sin(performance.now()/3000 + i)*50)%W;
    const y = (i*211 + Math.cos(performance.now()/4000 + i)*30)%H;
    ctx.fillText(KANJI[i % KANJI.length], x, y);
  }
  ctx.globalAlpha = 1;
  drawEmbers();
}

function drawMenu(){
  drawMenuBg();
  const s = uiScale();
  ctx.save();
  ctx.textAlign='center';
  const glitch = Math.random() < 0.05 ? (Math.random()-0.5)*12 : 0;

  ctx.fillStyle='#f00';
  ctx.font=`bold ${64*s}px Impact,sans-serif`;
  ctx.shadowBlur=25; ctx.shadowColor='#f00';
  ctx.fillText(t('title'), W/2+glitch, H/2 - 280*s);
  ctx.shadowBlur = 0;

  ctx.fillStyle='#fff'; ctx.font=`bold ${18*s}px monospace`;
  ctx.fillText(t('sub'),W/2,H/2 - 245*s);

  const items = [
    {key:'start', action:()=>startGame()},
    {key:'leaderboard', action:()=>{ gameState='leaderboard'; fetchLeaderboard(); selectedRow=0; lbTab=0; }},
    {key:'options', action:()=>{ gameState='options'; optIndex=0; }},
    {key: currentUser ? 'logout' : 'login', action:()=>{
      if(currentUser){ currentUser=null; localStorage.removeItem('ttl_user'); }
      else{ gameState='login'; loginInput=''; loginPass=''; loginMode='username'; loginError=''; }
    }}
  ];
  for(let i=0;i<items.length;i++){
    const y=H/2 - 140*s + i*75*s;
    const selected = menuIndex===i;
    ctx.fillStyle = selected ? '#0f0' : '#fff';
    if(selected){ ctx.shadowBlur=15; ctx.shadowColor='#0f0'; }
    ctx.font=`bold ${30*s}px monospace`;
    ctx.fillText((selected?'> ':'')+t(items[i].key)+(selected?' <':''), W/2, y);
    ctx.shadowBlur = 0;
  }

function getLeaderboardList(){
  if(lbTab===0){
    const map={};
    for(const r of leaderboardData){ if(!map[r.nome]||(r.pp||0)>(map[r.nome].pp||0)) map[r.nome]=r; }
    return Object.values(map).sort((a,b)=>(b.pp||0)-(a.pp||0)).slice(0,10);
  }
  return [...leaderboardData].sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)).slice(0,10);
}

// ============================================================
// MAIN DRAW
// ============================================================
function draw(){
  ctx.clearRect(0,0,W,H);
  if(gameState==='menu'){ drawMenu(); return; }
  if(gameState==='login'){ drawLogin(); return; }
  if(gameState==='leaderboard'){ drawLeaderboard(); return; }
  if(gameState==='options'){ drawOptions(); return; }

  if(currentScene === 'pocket' && pocket){
    if(shake > 0){
      ctx.save();
      ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
      drawPocket();
      ctx.restore();
    } else {
      drawPocket();
    }
    return;
  }

  // main world
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);

  drawGround();
  drawDecorations();
  drawDoors();

  const vL = camX-80, vR = camX+W+80, vT = camY-80, vB = camY+H+80;
  const inView = (x,y,r=40) => x+r>vL && x-r<vR && y+r>vT && y-r<vB;

  for(const o of xpOrbs){
    if(!inView(o.x,o.y,20)) continue;
    const sx = o.x-camX, sy = o.y-camY;
    ctx.save();
    ctx.shadowBlur=15; ctx.shadowColor = o.big?'#ff0':'#0ff';
    ctx.fillStyle = o.big?'#ff0':'#0ff';
    ctx.beginPath(); ctx.arc(sx,sy,o.big?14:6,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  for(const p of particles){
    if(!inView(p.x,p.y,p.r)) continue;
    ctx.globalAlpha = Math.min(1,p.life/20);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x-camX, p.y-camY, p.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for(const e of enemies) if(inView(e.x,e.y,30)) drawEnemy(e);
  for(const bo of bosses) if(bo.alive && inView(bo.x,bo.y,bo.r+30)) drawBoss(bo);

  for(const b of lobby.bullets){
    if(Date.now()-b.ts>3000) continue;
    if(!inView(b.x,b.y,10)) continue;
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = b.color || '#f0f';
    ctx.beginPath(); ctx.arc(b.x-camX, b.y-camY, 5, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for(const b of bullets){
    if(!inView(b.x,b.y,b.r)) continue;
    ctx.save();
    ctx.shadowBlur = b.crazy?20:15; ctx.shadowColor = b.color;
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(b.x-camX, b.y-camY, b.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  }

  for(const b of enemyBullets){
    if(!inView(b.x,b.y,b.r)) continue;
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(b.x-camX, b.y-camY, b.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  }

  for(const p of onlinePlayers){
    if(!inView(p.x,p.y,40)) continue;
    drawPlayerAt(p.x-camX, p.y-camY, p.color||'#0ff', false, p.hp/p.maxHp, p.name);
  }

  drawPlayerAt(player.x-camX, player.y-camY, myColor, true, player.hp/player.maxHp, currentUser||'You');

  for(const d of dmgTexts){
    if(!inView(d.x,d.y,30)) continue;
    ctx.globalAlpha = Math.min(1,d.life/20);
    ctx.fillStyle = d.color;
    ctx.font = `bold ${d.size||20}px monospace`;
    ctx.textAlign = 'center';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    ctx.strokeText(d.text, d.x-camX, d.y-camY);
    ctx.fillText(d.text, d.x-camX, d.y-camY);
  }
  ctx.globalAlpha = 1;

  drawBombEffects();
  drawVignette();
  drawEmbers();

  if(redFlash > 0){
    ctx.fillStyle = `rgba(255,0,0,${redFlash*0.4})`;
    ctx.fillRect(-50,-50,W+100,H+100);
  }

  if(flash>0){
    ctx.fillStyle = flashColor;
    ctx.globalAlpha = flash*0.5;
    ctx.fillRect(-50,-50,W+100,H+100);
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  drawHUD();

  if(gameState==='gameover'||gameState==='win') drawEndScreen();
}

// ============================================================
// INPUT
// ============================================================
function checkCheatBuffer(){
  if(cheatBuffer.includes('crazygun')){
    cheatBuffer = '';
    if(!cheatCrazygun){
      cheatCrazygun = true;
      localStorage.setItem('ttl_crazygun','1');
      flash = 1; flashColor = '#f0f';
      shake = 40;
      tryPlayMusic();
    }
  }
  if(cheatBuffer.includes('chaos')){
    cheatBuffer = '';
    if(gameState === 'playing' && currentScene === 'main'){
      enterPocket({theme: 'chaos'});
    }
  }
  if(cheatBuffer.includes('happy')){
    cheatBuffer = '';
    if(gameState === 'playing' && currentScene === 'main'){
      enterPocket({theme: 'happy'});
    }
  }
  if(cheatBuffer.includes('sad')){
    cheatBuffer = '';
    if(gameState === 'playing' && currentScene === 'main'){
      enterPocket({theme: 'sad'});
    }
  }
}

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if(['arrowleft','arrowright','arrowup','arrowdown',' ','backspace','tab'].includes(k)) e.preventDefault();
  tryPlayMusic();
  if(!audioCtx && e.key.length === 1){ setupAudioCtx(); }

  if((gameState==='menu' || gameState==='options' || gameState==='playing') && e.key.length === 1){
    cheatBuffer += e.key.toLowerCase();
    if(cheatBuffer.length > 20) cheatBuffer = cheatBuffer.slice(-20);
    checkCheatBuffer();
  }

  if(gameState==='login'){
    if(k==='tab'||k==='arrowleft'||k==='arrowright'){ loginMode = loginMode==='username'?'password':'username'; return; }
    if(k==='enter'){ submitLogin(); return; }
    if(k==='backspace'){
      if(loginMode==='username') loginInput = loginInput.slice(0,-1);
      else loginPass = loginPass.slice(0,-1);
      return;
    }
    if(k==='z'||k==='escape'){ gameState='menu'; loginError=''; return; }
    if(k.length===1){
      if(loginMode==='username' && loginInput.length<12) loginInput += e.key;
      else if(loginMode==='password' && loginPass.length<16) loginPass += e.key;
      return;
    }
  }

  if(keys[k]) return;
  keys[k] = true;
  if(k==='l') toggleLang();

  if(gameState==='menu'){
    if(k==='arrowup'||k==='w')   menuIndex = (menuIndex+3)%4;
    if(k==='arrowdown'||k==='s') menuIndex = (menuIndex+1)%4;
    if(k==='enter'||k==='z'||k===' '){
      if(menuIndex===0) startGame();
      else if(menuIndex===1){ gameState='leaderboard'; fetchLeaderboard(); selectedRow=0; lbTab=0; }
      else if(menuIndex===2){ gameState='options'; optIndex=0; }
      else{
        if(currentUser){ currentUser=null; localStorage.removeItem('ttl_user'); }
        else{ gameState='login'; loginInput=''; loginPass=''; loginMode='username'; loginError=''; }
      }
    }
  } else if(gameState==='options'){
    if(k==='arrowup'||k==='w')   optIndex = (optIndex+2)%3;
    if(k==='arrowdown'||k==='s') optIndex = (optIndex+1)%3;
    if(k==='escape')             gameState='menu';
    if(k==='enter'||k==='z'||k===' '){
      if(optIndex===0) setMouseControl(!mouseControlEnabled);
      else if(optIndex===1) setMusicEnabled(!musicEnabled);
      else gameState='menu';
    }
  } else if(gameState==='leaderboard'){
    if(k==='arrowleft'||k==='a'||k==='arrowright'||k==='d'){ lbTab=(lbTab+1)%2; selectedRow=0; }
    if(k==='arrowup'||k==='w')   selectedRow = Math.max(0,selectedRow-1);
    if(k==='arrowdown'||k==='s') selectedRow = Math.min(getLeaderboardList().length-1,selectedRow+1);
    if(k==='z'||k==='escape'||k==='enter') gameState='menu';
  } else if(gameState==='playing'){
    if(k==='x') useBomb();
    if(currentScene === 'pocket' && k==='escape') exitPocket();
  } else if(gameState==='gameover'||gameState==='win'){
    if(k==='z'||k==='enter'||k===' '){
      if(pendingScore && !currentUser){
        gameState='login'; loginInput=''; loginPass=''; loginMode='username'; loginError='';
      } else window.location.reload();
    }
  }
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()]=false);

function getPointerPos(e){
  const rect = canvas.getBoundingClientRect();
  const sx = canvas.width/rect.width, sy = canvas.height/rect.height;
  let cx=e.clientX, cy=e.clientY;
  if(e.touches && e.touches.length>0){ cx=e.touches[0].clientX; cy=e.touches[0].clientY; }
  return { x:(cx-rect.left)*sx, y:(cy-rect.top)*sy };
}

canvas.addEventListener('pointerdown', e => {
  if(!audioCtx) setupAudioCtx();
  const pos = getPointerPos(e);
  pointerActive = true; pointerSX = pos.x; pointerSY = pos.y;
  tryPlayMusic();
  if(pos.x>W-90 && pos.y<55){ toggleLang(); return; }
  if(gameState==='playing' && isMobile && pos.x>W-130 && pos.y>H-130){ useBomb(); return; }

  const s = uiScale();
  if(gameState==='menu'){
    for(let i=0;i<4;i++){
      const y=H/2 - 140*s + i*75*s;
      if(Math.abs(pos.y-y)<30*s){
        menuIndex=i;
        if(i===0) startGame();
        else if(i===1){ gameState='leaderboard'; fetchLeaderboard(); selectedRow=0; lbTab=0; }
        else if(i===2){ gameState='options'; optIndex=0; }
        else{
          if(currentUser){ currentUser=null; localStorage.removeItem('ttl_user'); }
          else{ gameState='login'; loginInput=''; loginPass=''; loginMode='username'; loginError=''; }
        }
        return;
      }
    }
  } else if(gameState==='options'){
    for(let i=0;i<3;i++){
      const y=H/2 - 80*s + i*80*s;
      if(Math.abs(pos.y-y)<30*s){
        optIndex=i;
        if(i===0) setMouseControl(!mouseControlEnabled);
        else if(i===1) setMusicEnabled(!musicEnabled);
        else gameState='menu';
        return;
      }
    }
  } else if(gameState==='login'){
    if(pos.y>H/2-70*s && pos.y<H/2-10*s) loginMode='username';
    else if(pos.y>H/2+10*s && pos.y<H/2+70*s) loginMode='password';
    else if(pos.y>H/2+120*s && pos.y<H/2+180*s) submitLogin();
    else if(pos.y>H/2+200*s){ gameState='menu'; loginError=''; }
  } else if(gameState==='leaderboard'){
    if(pos.y>100*s && pos.y<140*s){ lbTab = pos.x<W/2?0:1; selectedRow=0; }
    else if(pos.y>H-80*s) gameState='menu';
  } else if(gameState==='gameover'||gameState==='win'){
    if(pendingScore && !currentUser){
      gameState='login'; loginInput=''; loginPass=''; loginMode='username'; loginError='';
    } else window.location.reload();
  }
});

canvas.addEventListener('pointermove', e => {
  const pos = getPointerPos(e);
  pointerSX = pos.x; pointerSY = pos.y;
  if(e.pointerType!=='mouse') pointerActive = true;
});
canvas.addEventListener('pointerup', ()=>{ pointerActive=false; });
canvas.addEventListener('pointercancel', ()=>{ pointerActive=false; });

// ============================================================
// LOOP
// ============================================================
let lastTime = performance.now();
let accumulator = 0;
const STEP = 1000/60;

function loop(now){
  if(!now) now = performance.now();
  let dt = now - lastTime; lastTime = now;
  if(dt>100) dt = 100;
  accumulator += dt;
  let n = 0;
  while(accumulator >= STEP){
    if(gameState==='playing'){
      if(currentScene === 'main') updateMain();
      else if(currentScene === 'pocket') updatePocket();
    } else if(gameState==='menu' || gameState==='options'){
      for(const e of EMBERS){
        e.x += e.vx*(1/60); e.y += e.vy*(1/60); e.life += 1/60;
        if(e.life>e.maxLife || e.y<-20){
          e.x = Math.random()*W; e.y = H+10;
          e.vx = (Math.random()-0.5)*30; e.vy = -30-Math.random()*50;
          e.life = 0; e.maxLife = 3+Math.random()*4;
        }
      }
      MusicMgr.tick();
    }
    accumulator -= STEP;
    n++;
    if(n>5){ accumulator=0; break; }
  }
  draw();
  requestAnimationFrame(loop);
}

// ============================================================
// BOOT
// ============================================================
generateHellTiles();
generateDecorations();
spawnDoors();
initEmbers();
if(currentUser && isBinConfigured()){ onlineActive=true; onlineLoop(); }
if(musicEnabled) tryPlayMusic();
requestAnimationFrame(loop);
