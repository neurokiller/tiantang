async function hashPassword(pw){
  const b=new TextEncoder().encode(pw);
  const h=await crypto.subtle.digest('SHA-256',b);
  return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
function isBinConfigured(){ return !BIN_ID.includes('COLE_AQUI') && !BIN_KEY.includes('COLE_AQUI'); }

async function readBin(){
  for(let i=0;i<3;i++){
    try{
      const r=await fetch(`${API_URL}/latest`,{headers:{'X-Master-Key':BIN_KEY}});
      if(r.status===429){ await sleep(1500*(i+1)); continue; }
      if(!r.ok) throw new Error('read '+r.status);
      const d=await r.json();
      return d.record;
    }catch(e){ if(i===2) throw e; await sleep(600*(i+1)); }
  }
}
async function writeBin(data){
  for(let i=0;i<3;i++){
    try{
      const r=await fetch(API_URL,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':BIN_KEY},body:JSON.stringify(data)});
      if(r.status===429){ await sleep(2000*(i+1)); continue; }
      if(!r.ok) throw new Error('write '+r.status);
      return true;
    }catch(e){ if(i===2) return false; await sleep(800*(i+1)); }
  }
  return false;
}

async function fetchLeaderboard(){
  if(!isBinConfigured()) return;
  try{
    const rec=await readBin();
    leaderboardData=(rec&&rec.leaderboard)||[];

  }catch(e){ console.error(e); }
}
async function saveScore(name,score){
  if(isSaving||!isBinConfigured()) return;
  isSaving=true;
  try{
    const rec=await readBin();
    const lb=rec.leaderboard||[], us=rec.users||{};
    const date=new Date().toLocaleString(lang==='pt'?'pt-BR':lang==='cn'?'zh-CN':'en-US',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});

    while(lb.length>1000) lb.shift();
    await writeBin({...rec,leaderboard:lb,users:us});
    leaderboardData=lb; usersData=us;
  }finally{ isSaving=false; }
}
async function submitLogin(){
  if(!loginInput.trim()||!loginPass.trim()){ loginError=t('fillErr'); return; }
  if(!isBinConfigured()){ loginError='JSONBIN NOT CONFIGURED'; return; }
  loginError='';
  try{
    const hash=await hashPassword(loginPass);
    const rec=await readBin();
    const us=rec.users||{}, lb=rec.leaderboard||{};
    if(!us[loginInput]){
      us[loginInput]=hash;
      await writeBin({...rec,users:us,leaderboard:Array.isArray(lb)?lb:[]});
      currentUser=loginInput; localStorage.setItem('ttl_user',currentUser);
      loginInput=''; loginPass=''; gameState='menu';
      if(pendingScore){ await saveScore(currentUser,pendingScore); pendingScore=null; }
    }else{
      if(us[loginInput]===hash){
        currentUser=loginInput; localStorage.setItem('ttl_user',currentUser);
        loginInput=''; loginPass=''; gameState='menu';
        if(pendingScore){ await saveScore(currentUser,pendingScore); pendingScore=null; }
      }else loginError=t('loginErr');
    }
  }catch(e){ console.error(e); loginError='NETWORK ERROR'; }
}

let lastBossKills = {}; // {bossId: ts} - detect kills from other players
let lastBossHpSnapshot = {}; // to detect boss respawns
let onlineStatus='offline', onlinePending=false;

const POLL_MS = 3000;      // read every 3s
const PLAYER_TIMEOUT = 20000;

async function onlinePoll(){
  if(!isBinConfigured()||!currentUser) return;
  if(onlinePending) return;
  onlinePending=true;
  try{
    const rec=await readBin();
    if(rec&&rec.lobby){
      lobby = rec.lobby;
      if(!lobby.players) lobby.players={};
      if(!lobby.bossHp) lobby.bossHp={};
      if(!lobby.bullets) lobby.bullets=[];
      // process remote players
      const now=Date.now();
      onlinePlayers=[];
      for(const id in lobby.players){
        const p=lobby.players[id];
        if(!p||!p.ts||now-p.ts>PLAYER_TIMEOUT) continue;
        if(id===clientId) continue;
        onlinePlayers.push({id,...p});
      }
      // detect boss kills by others
      for(const bid in lobby.bossHp){
        const cur=lobby.bossHp[bid];
        const prev=lastBossHpSnapshot[bid];
        if(prev!==undefined && prev>0 && cur>prev){
          // boss respawned - was killed by someone
          lastBossKills[bid]=now;
        }
        lastBossHpSnapshot[bid]=cur;
      }
    }
    onlineStatus='ok';
    lastRead=Date.now();
  }catch(e){
    console.error('poll error',e);
    onlineStatus='error';
  }finally{ onlinePending=false; }
}

async function onlinePush(){
  if(!isBinConfigured()||!currentUser||!player) return;
  if(onlinePending) return;
  onlinePending=true;
  try{
    const rec=await readBin();
    if(!rec) return;
    const now=Date.now();
    const L=rec.lobby||{};
    const players=L.players||{}, bossHp=L.bossHp||{}, bullets=L.bullets||[];

    // my player entry
    players[clientId]={
      x:player.x, y:player.y, hp:player.hp, maxHp:player.maxHp,
      lv:player.level, name:currentUser, color:myColor,
      ts:now
    };
    // prune
    for(const id in players){
      if(!players[id]||!players[id].ts||now-players[id].ts>PLAYER_TIMEOUT) delete players[id];
    }

    // apply my pending boss damage
    for(const bid in pendingBossDmg){
      if(pendingBossDmg[bid]>0){
        const maxHp=ZONES.find(z=>z.id===bid)?.bossHp||1;
        const cur=bossHp[bid]!==undefined?bossHp[bid]:maxHp;
        bossHp[bid]=Math.max(0,cur-pendingBossDmg[bid]);
      }
    }

    // append my bullets + prune old
    let bl=bullets.filter(b=>now-b.ts<3000);
    bl=bl.concat(pendingBullets.map(b=>({...b,pid:clientId,color:myColor,ts:now}))).slice(-80);

    const newLobby={players,bossHp,bullets:bl,ts:now};
    await writeBin({...rec,lobby:newLobby});
    lobby=newLobby;
    pendingBossDmg={};
    pendingBullets=[];
    lastWrite=Date.now();
  }catch(e){
    console.error('push error',e);
  }finally{ onlinePending=false; }
}

async function onlineLoop(){
  if(!isBinConfigured()||!currentUser) { setTimeout(onlineLoop, 3000); return; }
  try{
    await onlinePoll();
    if(gameState==='playing' && player){
      await onlinePush();
    }
  }catch(e){ console.error(e); }
  setTimeout(onlineLoop, POLL_MS);
}

function buildKanjiAtlas(){
  const uniq=[...new Set(KANJI.join(''))];
  const size=64;
  const c=document.createElement('canvas');
  c.width=uniq.length*size; c.height=size;
  const g=c.getContext('2d');
  g.font=`bold ${size-8}px "Noto Sans CJK SC",sans-serif`;
  g.textAlign='center'; g.textBaseline='middle';
  g.fillStyle='#f00';
  uniq.forEach((ch,i)=>g.fillText(ch,i*size+size/2,size/2));
  kanjiAtlas={canvas:c,chars:uniq,size};
}

let seed=12345;
function rnd(){ seed=(seed*9301+49297)%233280; return seed/233280; }

function generateDecorations(){
  seed=98765;
  const uniqChars=[...new Set(KANJI.join(''))];
  for(const z of ZONES){
    for(let i=0;i<500;i++){
      decorations.push({x:rnd()*WORLD_W,y:z.startY+rnd()*(z.endY-z.startY),r:20+rnd()*60,type:'orb',color:z.orbColor});
    }
    for(let i=0;i<250;i++){
      const ch=uniqChars[Math.floor(rnd()*uniqChars.length)];
      const idx=uniqChars.indexOf(ch);
      decorations.push({x:rnd()*WORLD_W,y:z.startY+rnd()*(z.endY-z.startY),type:'kanji',idx,size:20+rnd()*80,alpha:0.08+rnd()*0.28});
    }
    for(let i=0;i<120;i++){
      decorations.push({x:rnd()*WORLD_W,y:z.startY+rnd()*(z.endY-z.startY),type:'shape',shape:z.id,r:15+rnd()*35,color:z.bossColor,rot:rnd()*Math.PI*2});
    }
  }
}

  if(roll<0.60) e={x,y,r:15,hp:25*tier,maxHp:25*tier,dmg:8+tier*2,speed:1.4+tier*0.10,xp:8+tier*3,type:'jiangshi',color:'#c00',atkCd:0};
  else if(roll<0.88) e={x,y,r:13,hp:20*tier,maxHp:20*tier,dmg:6+tier*2,speed:1.1+tier*0.10,xp:12+tier*3,type:'spirit',color:'#f0f',atkCd:60+Math.random()*60};
  else e={x,y,r:26,hp:80*tier,maxHp:80*tier,dmg:14+tier*3,speed:0.9+tier*0.05,xp:25+tier*5,type:'tank',color:'#800',atkCd:0};
  enemies.push(e);
}

function useBomb(){
  if(!player||player.bombs<=0) return;
  player.bombs--;
  shake=40;flash=1;flashColor='#f00';
  const R=400;
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(Math.hypot(e.x-player.x,e.y-player.y)<R){
      e.hp-=200;
      dmgTexts.push({x:e.x,y:e.y,text:'200',life:40,color:'#f0f',vy:-1});
      if(e.hp<=0){ xpOrbs.push({x:e.x,y:e.y,xp:e.xp}); enemies.splice(i,1); kills++; }
    }
  }
  for(const bo of bosses){
    if(!bo.alive) continue;
    if(Math.hypot(bo.x-player.x,bo.y-player.y)<R){
      bo.hp-=300;
      reportBossDamage(bo.zoneId,300);
      if(bo.hp<=0) killBoss(bo);
    }
  }
  enemyBullets=[];
  for(let i=0;i<40;i++) particles.push({x:player.x,y:player.y,vx:(Math.random()-.5)*20,vy:(Math.random()-.5)*20,life:50,color:Math.random()>.5?'#f00':'#ff0',r:3+Math.random()*5});
}

function killBoss(bo){
  bo.alive=false; bossesKilled++;
  flash=1; flashColor='#fff';
  for(let k=0;k<80;k++) particles.push({x:bo.x,y:bo.y,vx:(Math.random()-.5)*22,vy:(Math.random()-.5)*22,life:70,color:Math.random()>.5?'#f00':'#ff0',r:4+Math.random()*6});
  xpOrbs.push({x:bo.x,y:bo.y,xp:bo.xp,big:true});
  if(bossesKilled>=10) endGame(true);
}

function endGame(won){
  gameState=won?'win':'gameover';
  shake=40;
  const pp=player.level*100+bossesKilled*2500+kills*5+Math.floor(time*3);
  pendingScore={level:player.level,kills,bosses:bossesKilled,tempo:time,pp};
  if(currentUser) saveScore(currentUser,pendingScore);
}

// ============================================================
// UPDATE
// ============================================================
function update(){
  time+=1/60;
  if(shake>0){ shake*=0.9; if(shake<0.5) shake=0; }
  if(flash>0) flash-=0.02;

  let mx=0,my=0;
  if(keys['w']||keys['arrowup'])    my-=1;
  if(keys['s']||keys['arrowdown'])  my+=1;
  if(keys['a']||keys['arrowleft'])  mx-=1;
  if(keys['d']||keys['arrowright']) mx+=1;

  if(mx||my){
    const m=Math.hypot(mx,my);
    player.x+=(mx/m)*player.speed;
    player.y+=(my/m)*player.speed;
  } else if(isMobile){
    if(pointerActive){
      const wx=camX+pointerSX, wy=camY+pointerSY;
      const dx=wx-player.x, dy=wy-player.y, d=Math.hypot(dx,dy);
      if(d>15){ player.x+=(dx/d)*player.speed; player.y+=(dy/d)*player.speed; }
    }
  } else if(mouseControlEnabled){
    const wx=camX+pointerSX, wy=camY+pointerSY;
    const dx=wx-player.x, dy=wy-player.y, d=Math.hypot(dx,dy);
    if(d>15){ player.x+=(dx/d)*player.speed; player.y+=(dy/d)*player.speed; }
  }

  player.x=Math.max(30,Math.min(WORLD_W-30,player.x));
  player.y=Math.max(30,Math.min(WORLD_H-30,player.y));

  const tcx=Math.max(0,Math.min(WORLD_W-W,player.x-W/2));
  const tcy=Math.max(0,Math.min(WORLD_H-H,player.y-H/2));
  camX+=(tcx-camX)*0.15;
  camY+=(tcy-camY)*0.15;

  if(player.atkCd>0) player.atkCd--;
  if(player.invuln>0) player.invuln--;

  // auto attack
  if(player.atkCd<=0){
    let closest=null, best=player.atkRange*player.atkRange;
    for(const e of enemies){
      const d=(e.x-player.x)**2+(e.y-player.y)**2;
      if(d<best){ best=d; closest=e; }
    }
    for(const bo of bosses){
      if(!bo.alive) continue;
      const d=(bo.x-player.x)**2+(bo.y-player.y)**2;
      if(d<best){ best=d; closest=bo; }
    }
    if(closest){
      const ang=Math.atan2(closest.y-player.y,closest.x-player.x);
      const nb={x:player.x,y:player.y,vx:Math.cos(ang)*16,vy:Math.sin(ang)*16,r:7,dmg:player.dmg,life:40,color:'#ff2222'};
      bullets.push(nb);
      reportBullet(nb);
      player.atkCd=player.atkRate;
    }
  }

  spawnTimer--;
  if(spawnTimer<=0){ spawnMinion(); spawnTimer=Math.max(8,45-player.level*2); }

  // enemies
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    const dx=player.x-e.x, dy=player.y-e.y, d=Math.hypot(dx,dy)||1;
    if(e.type==='spirit'){
      if(d>350){ e.x+=dx/d*e.speed; e.y+=dy/d*e.speed; }
      else if(d<250){ e.x-=dx/d*e.speed; e.y-=dy/d*e.speed; }
      if(e.atkCd>0) e.atkCd--;
      else if(d<550){
        const ang=Math.atan2(dy,dx);
        enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(ang)*5,vy:Math.sin(ang)*5,r:8,dmg:e.dmg,color:'#f0f'});
        e.atkCd=100;
      }
    } else {
      e.x+=dx/d*e.speed; e.y+=dy/d*e.speed;
      if(d<e.r+player.r && player.invuln<=0){
        player.hp-=e.dmg; player.invuln=40; shake=12;
        e.x-=dx/d*50; e.y-=dy/d*50;
      }
    }
    if(d>2200) enemies.splice(i,1);
  }

  // player bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx; b.y+=b.vy; b.life--;
    let hit=false;
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      if((e.x-b.x)**2+(e.y-b.y)**2<(e.r+b.r)**2){
        e.hp-=b.dmg;
        dmgTexts.push({x:e.x,y:e.y-e.r,text:Math.round(b.dmg),life:40,color:'#fff',vy:-1});
        if(e.hp<=0){
          xpOrbs.push({x:e.x,y:e.y,xp:e.xp});
          for(let k=0;k<8;k++) particles.push({x:e.x,y:e.y,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,life:30,color:e.color,r:3+Math.random()*3});
          enemies.splice(j,1); kills++;
        }
        hit=true; break;
      }
    }
    if(!hit){
      for(const bo of bosses){
        if(!bo.alive) continue;
        if((bo.x-b.x)**2+(bo.y-b.y)**2<(bo.r+b.r)**2){
          bo.hp-=b.dmg;
          reportBossDamage(bo.zoneId,b.dmg);
          dmgTexts.push({x:bo.x+(Math.random()-.5)*40,y:bo.y-bo.r,text:Math.round(b.dmg),life:40,color:'#ff0',vy:-1});
          if(bo.hp<=0) killBoss(bo);
          hit=true; break;
        }
      }
    }
    if(hit||b.life<=0) bullets.splice(i,1);
  }

  // enemy bullets
  for(let i=enemyBullets.length-1;i>=0;i--){
    const b=enemyBullets[i];
    b.x+=b.vx; b.y+=b.vy;
    if(player.invuln<=0 && (b.x-player.x)**2+(b.y-player.y)**2<(b.r+player.r)**2){
      player.hp-=b.dmg; player.invuln=40; shake=12;
      enemyBullets.splice(i,1); continue;
    }
    if(b.x<0||b.x>WORLD_W||b.y<0||b.y>WORLD_H) enemyBullets.splice(i,1);
  }

  // xp orbs
  for(let i=xpOrbs.length-1;i>=0;i--){
    const o=xpOrbs[i];
    const dx=player.x-o.x, dy=player.y-o.y, d=Math.hypot(dx,dy)||1;
    if(d<320){ o.x+=dx/d*9; o.y+=dy/d*9; }
    if(d<25){ player.xp+=o.xp; xpOrbs.splice(i,1); while(player.xp>=player.xpNext) levelUp(); }
  }

  // particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vx*=0.95; p.vy*=0.95; p.life--;
    if(p.life<=0) particles.splice(i,1);
  }
  for(let i=dmgTexts.length-1;i>=0;i--){
    const d=dmgTexts[i];
    d.y+=d.vy; d.life--;
    if(d.life<=0) dmgTexts.splice(i,1);
  }

  // bosses
  for(const bo of bosses){
    if(!bo.alive) continue;
    // sync from online
    if(lobby.bossHp && lobby.bossHp[bo.zoneId]!==undefined){
      const srvHp=lobby.bossHp[bo.zoneId];
      const pending=pendingBossDmg[bo.zoneId]||0;
      const effective=Math.max(0,srvHp-pending);
      if(effective<bo.hp) bo.hp=effective; // only decrease via sync
      // if server killed but we still see alive, mark dead
      if(srvHp<=0 && (pendingBossDmg[bo.zoneId]||0)===0 && bo.hp>0){
        bo.hp=0;
        if(bo.alive) killBoss(bo);
      }
    }
    const dx=player.x-bo.x, dy=player.y-bo.y, d=Math.hypot(dx,dy)||1;
    bo.active=d<1300;
    if(!bo.active) continue;
    if(d>bo.r+player.r+50){
      bo.x+=dx/d*bo.speed; bo.y+=dy/d*bo.speed;
    }
    if(d<bo.r+player.r && player.invuln<=0){
      player.hp-=bo.dmg; player.invuln=40; shake=15;
    }
    if(bo.atkCd>0) bo.atkCd--;
    else{
      const n=10+bo.phase*4;
      for(let i=0;i<n;i++){
        const ang=(i/n)*Math.PI*2+time*0.3;
        enemyBullets.push({x:bo.x,y:bo.y,vx:Math.cos(ang)*4,vy:Math.sin(ang)*4,r:9,dmg:bo.dmg*0.6,color:bo.color});
      }
      const ang=Math.atan2(dy,dx);
      enemyBullets.push({x:bo.x,y:bo.y,vx:Math.cos(ang)*7,vy:Math.sin(ang)*7,r:11,dmg:bo.dmg,color:'#fff'});
      bo.atkCd=Math.max(40,100-bo.phase*10);
      if(Math.random()<0.1) bo.phase=Math.min(3,bo.phase+1);
    }
  }

  if(player.hp<=0){ player.hp=0; endGame(false); }
}

function drawWorld(){
  const zIdx=currentZoneIdx();
  const zone=ZONES[zIdx];
  ctx.fillStyle=zone.bgColor;
  ctx.fillRect(0,0,W,H);

  const vL=camX-80, vR=camX+W+80, vT=camY-80, vB=camY+H+80;
  const inView=(d)=>d.x>vL&&d.x<vR&&d.y>vT&&d.y<vB;

  // orbs
  for(const d of decorations){
    if(d.type!=='orb'||!inView(d)) continue;
    const sx=d.x-camX, sy=d.y-camY;
    const grd=ctx.createRadialGradient(sx,sy,0,sx,sy,d.r);
    grd.addColorStop(0,d.color);
    grd.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=grd;
    ctx.beginPath(); ctx.arc(sx,sy,d.r,0,Math.PI*2); ctx.fill();
  }
  // kanji
  if(kanjiAtlas){
    for(const d of decorations){
      if(d.type!=='kanji'||!inView(d)) continue;
      const sx=d.x-camX, sy=d.y-camY;
      const s=kanjiAtlas.size;
      ctx.globalAlpha=d.alpha;
      ctx.drawImage(kanjiAtlas.canvas,d.idx*s,0,s,s,sx-d.size/2,sy-d.size/2,d.size,d.size);
      ctx.globalAlpha=1;
    }
  }
  // shapes (zone-specific decoration)
  for(const d of decorations){
    if(d.type!=='shape'||!inView(d)) continue;
    const sx=d.x-camX, sy=d.y-camY;
    ctx.save();
    ctx.translate(sx,sy);
    ctx.rotate(d.rot);
    ctx.fillStyle=d.color;
    ctx.globalAlpha=0.35;
    if(d.shape%3===0){ // torii-like
      ctx.fillRect(-d.r,-d.r*0.2,d.r*2,d.r*0.4);
      ctx.fillRect(-d.r*0.7,-d.r*0.8,d.r*0.15,d.r*1.6);
      ctx.fillRect(d.r*0.55,-d.r*0.8,d.r*0.15,d.r*1.6);
    } else if(d.shape%3===1){ // pentagram
      ctx.beginPath();
      for(let i=0;i<5;i++){
        const a=(i/5)*Math.PI*2-Math.PI/2;
        const a2=((i+2)/5)*Math.PI*2-Math.PI/2;
        ctx.moveTo(Math.cos(a)*d.r,Math.sin(a)*d.r);
        ctx.lineTo(Math.cos(a2)*d.r,Math.sin(a2)*d.r);
      }
      ctx.strokeStyle=d.color; ctx.lineWidth=2; ctx.stroke();
    } else { // diamond
      ctx.beginPath();
      ctx.moveTo(0,-d.r); ctx.lineTo(d.r,0); ctx.lineTo(0,d.r); ctx.lineTo(-d.r,0); ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }
  // zone borders
  for(const z of ZONES){
    if(z.startY===0) continue;
    const sy=z.startY-camY;
    if(sy<-10||sy>H+10) continue;
    ctx.strokeStyle='rgba(255,0,0,0.5)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(0,sy); ctx.lineTo(W,sy); ctx.stroke();
  }
}

function drawPlayerAt(x,y,color,isMe,hpPct,name){
  ctx.save();
  ctx.translate(x,y);
  if(isMe&&player.invuln>0&&Math.floor(performance.now()/80)%2===0) ctx.globalAlpha=0.4;
  ctx.fillStyle='rgba(255,0,0,0.35)';
  ctx.beginPath(); ctx.arc(0,0,24,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=color||'#8B0000';
  ctx.beginPath(); ctx.arc(0,0,16,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#c00';
  ctx.beginPath(); ctx.arc(0,0,11,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(-5,-3,3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(5,-3,3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#f00';
  ctx.beginPath(); ctx.arc(-5,-3,1.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(5,-3,1.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ff0';
  ctx.fillRect(-4,-26,8,14);
  ctx.fillStyle='#f00';
  ctx.font='bold 8px sans-serif';
  ctx.textAlign='center';
  ctx.fillText('咒',0,-17);
  // name & hp bar
  if(name){
    ctx.fillStyle=color||'#fff';
    ctx.font='bold 11px monospace';
    ctx.fillText(name,0,-42);
    if(hpPct!==undefined&&hpPct<1){
      ctx.fillStyle='#000'; ctx.fillRect(-25,-38,50,4);
      ctx.fillStyle='#f00'; ctx.fillRect(-25,-38,50*Math.max(0,hpPct),4);
    }
  }
  ctx.restore();
}

function drawEnemy(e){
  const sx=e.x-camX, sy=e.y-camY;
  ctx.save();
  ctx.translate(sx,sy);
  if(e.type==='jiangshi'){
    ctx.fillStyle=e.color;
    ctx.beginPath(); ctx.arc(0,0,e.r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#f00'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(-4,-3,2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(4,-3,2,0,Math.PI*2); ctx.fill();
  } else if(e.type==='spirit'){
    ctx.shadowBlur=20; ctx.shadowColor=e.color;
    ctx.fillStyle=e.color;
    ctx.beginPath(); ctx.arc(0,0,e.r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(-3,-2,2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(3,-2,2,0,Math.PI*2); ctx.fill();
  } else {
    ctx.fillStyle=e.color;
    ctx.beginPath(); ctx.arc(0,0,e.r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#f00'; ctx.lineWidth=3; ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(-7,-5,4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(7,-5,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath(); ctx.arc(-7,-5,2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(7,-5,2,0,Math.PI*2); ctx.fill();
  }
  if(e.hp<e.maxHp){
    const w=e.r*2;
    ctx.fillStyle='#000'; ctx.fillRect(-w/2,-e.r-12,w,4);
    ctx.fillStyle='#f00'; ctx.fillRect(-w/2,-e.r-12,w*(e.hp/e.maxHp),4);
  }
  ctx.restore();
}

function drawBoss(bo){
  const sx=bo.x-camX, sy=bo.y-camY;
  ctx.save();
  ctx.translate(sx,sy);
  const pulse=1+Math.sin(time*4)*0.05;
  ctx.scale(pulse,pulse);
  const img=bossImages[bo.zoneId-1];
  if(img&&img.complete&&img.naturalWidth>0){
    ctx.drawImage(img,-bo.r,-bo.r,bo.r*2,bo.r*2);
    ctx.strokeStyle=bo.color; ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(0,0,bo.r+6,0,Math.PI*2); ctx.stroke();
  } else {
    ctx.shadowBlur=40; ctx.shadowColor=bo.color;
    ctx.fillStyle=bo.color;
    ctx.beginPath(); ctx.arc(0,0,bo.r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle='#fff'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(0,0,bo.r+8,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(-bo.r*0.3,-bo.r*0.15,bo.r*0.15,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(bo.r*0.3,-bo.r*0.15,bo.r*0.15,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath(); ctx.arc(-bo.r*0.3,-bo.r*0.15,bo.r*0.07,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(bo.r*0.3,-bo.r*0.15,bo.r*0.07,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
  ctx.save();
  ctx.fillStyle='#fff';
  ctx.font='bold 18px Impact,sans-serif';
  ctx.textAlign='center';
  ctx.strokeStyle='#000'; ctx.lineWidth=4;
  ctx.strokeText(bo.name,sx,sy-bo.r-20);
  ctx.fillText(bo.name,sx,sy-bo.r-20);
  ctx.restore();
}

function drawHUD(){
  ctx.save();
  const hpW=300,hpH=22;
  ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(20,20,hpW+4,hpH+4);
  ctx.fillStyle='#500'; ctx.fillRect(22,22,hpW,hpH);
  ctx.fillStyle=player.hp>player.maxHp*0.3?'#f00':'#ff0';
  ctx.fillRect(22,22,hpW*Math.max(0,player.hp/player.maxHp),hpH);
  ctx.strokeStyle='#f00'; ctx.lineWidth=2; ctx.strokeRect(20,20,hpW+4,hpH+4);
  ctx.fillStyle='#fff'; ctx.font='bold 14px monospace'; ctx.textAlign='center';
  ctx.fillText(`${t('hp')} ${Math.ceil(player.hp)}/${player.maxHp}`,22+hpW/2,38);
  ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(20,50,hpW+4,14);
  ctx.fillStyle='#003'; ctx.fillRect(22,52,hpW,10);
  ctx.fillStyle='#0af'; ctx.fillRect(22,52,hpW*(player.xp/player.xpNext),10);
  ctx.strokeStyle='#0af'; ctx.lineWidth=1; ctx.strokeRect(20,50,hpW+4,14);
  ctx.fillStyle='#ff0'; ctx.font='bold 28px Impact,sans-serif'; ctx.textAlign='left';
  ctx.fillText(`LV ${player.level}`,20,100);
  ctx.fillStyle='#fff'; ctx.font='bold 15px monospace';
  ctx.fillText(`${t('kills')}: ${kills}`,150,90);
  ctx.fillText(`${t('bosses')}: ${bossesKilled}/10`,150,112);
  ctx.fillText(`${t('time')}: ${time.toFixed(1)}s`,150,134);
  ctx.fillStyle='#f0f'; ctx.font='bold 18px monospace';
  ctx.fillText(`💣 ${player.bombs} [X]`,20,130);

  const zone=ZONES[currentZoneIdx()];
  ctx.fillStyle=zone.bossColor; ctx.font='bold 20px Impact,sans-serif'; ctx.textAlign='center';
  ctx.fillText(`ZONE ${zone.id} — ${t(zone.name)}`,W/2,40);

  // active boss bars
  let yOff=70;
  for(const bo of bosses){
    if(!bo.alive||!bo.active) continue;
    ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(W/2-150,yOff,300,18);
    ctx.fillStyle='#400'; ctx.fillRect(W/2-148,yOff+2,296,14);
    ctx.fillStyle=bo.color; ctx.fillRect(W/2-148,yOff+2,296*(bo.hp/bo.maxHp),14);
    ctx.strokeStyle=bo.color; ctx.lineWidth=2; ctx.strokeRect(W/2-150,yOff,300,18);
    ctx.fillStyle='#fff'; ctx.font='bold 12px monospace';
    ctx.fillText(bo.name,W/2,yOff+14);
    yOff+=26;
  }
  // off-screen boss arrows
  for(const bo of bosses){
    if(!bo.alive||bo.active) continue;
    const dx=bo.x-player.x, dy=bo.y-player.y;
    const ang=Math.atan2(dy,dx);
    const radius=Math.min(W,H)*0.42;
    const px=W/2+Math.cos(ang)*radius;
    const py=H/2+Math.sin(ang)*radius;
    ctx.save();
    ctx.translate(px,py); ctx.rotate(ang);
    ctx.fillStyle=bo.color;
    ctx.shadowBlur=10; ctx.shadowColor=bo.color;
    ctx.beginPath(); ctx.moveTo(15,0); ctx.lineTo(-10,-10); ctx.lineTo(-10,10); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // online status
  ctx.textAlign='right';
  ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(W-180,60,170,44);
  ctx.strokeStyle=onlineStatus==='ok'?'#0f0':onlineStatus==='error'?'#f00':'#666';
  ctx.lineWidth=2; ctx.strokeRect(W-180,60,170,44);
  ctx.fillStyle=onlineStatus==='ok'?'#0f0':onlineStatus==='error'?'#f00':'#666';
  ctx.font='bold 14px monospace';
  ctx.fillText(`🌐 ${t('online')}: ${onlinePlayers.length+1}`,W-15,80);
  ctx.fillStyle='#fff'; ctx.font='11px monospace';
  ctx.fillText(`ID: ${clientId.slice(0,6)}`,W-15,96);

  // language button
  ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(W-90,20,70,32);
  ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.strokeRect(W-90,20,70,32);
  ctx.fillStyle='#fff'; ctx.font='bold 16px monospace'; ctx.textAlign='center';
  ctx.fillText(lang.toUpperCase(),W-55,42);

  if(isMobile){
    ctx.fillStyle='rgba(255,0,255,0.4)';
    ctx.beginPath(); ctx.arc(W-70,H-70,45,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#f0f'; ctx.lineWidth=4; ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='bold 30px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('💣',W-70,H-70);
    ctx.textBaseline='alphabetic';
  }
  if(!isMobile){
    ctx.fillStyle=mouseControlEnabled?'#0f0':'#666';
    ctx.font='bold 12px monospace'; ctx.textAlign='left';
    ctx.fillText(mouseControlEnabled?'🖱 MOUSE: ON':'⌨ KEYBOARD',20,H-20);
  }
  ctx.restore();
}

function drawMenuBg(){
  ctx.fillStyle='#050000'; ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=0.3;
  if(kanjiAtlas){
    for(let i=0;i<40;i++){
      const idx=(i*7)%kanjiAtlas.chars.length;
      const x=(i*137)%W, y=(i*211)%H, s=kanjiAtlas.size;
      ctx.drawImage(kanjiAtlas.canvas,idx*s,0,s,s,x-30,y-30,60,60);
    }
  }
  ctx.globalAlpha=1;
}

function drawMenu(){
  drawMenuBg();
  ctx.save();
  ctx.textAlign='center';
  const glitch=Math.random()<0.05?(Math.random()-.5)*10:0;
  ctx.fillStyle='#f00'; ctx.font='bold 60px Impact,sans-serif';
  ctx.shadowBlur=20; ctx.shadowColor='#f00';
  ctx.fillText(t('title'),W/2+glitch,130);
  ctx.shadowBlur=0;
  ctx.fillStyle='#fff'; ctx.font='bold 18px monospace';
  ctx.fillText(t('sub'),W/2,165);

  const items=[
    {key:'start',action:()=>startGame()},
    {key:'leaderboard',action:()=>{gameState='leaderboard';fetchLeaderboard();selectedRow=0;lbTab=0;}},
    {key:'options',action:()=>{gameState='options';optIndex=0;}},
    {key:currentUser?'logout':'login',action:()=>{
      if(currentUser){ currentUser=null; localStorage.removeItem('ttl_user'); }
      else{ gameState='login'; loginInput=''; loginPass=''; loginMode='username'; loginError=''; }
    }}
  ];
  for(let i=0;i<items.length;i++){
    const y=300+i*75;
    ctx.fillStyle=menuIndex===i?'#0f0':'#fff';
    ctx.font='bold 30px monospace';
    ctx.fillText((menuIndex===i?'> ':'')+t(items[i].key)+(menuIndex===i?' <':''),W/2,y);
  }
  if(currentUser){
    ctx.fillStyle='#0ff'; ctx.font='bold 18px monospace';
    ctx.fillText(`${t('loggedAs')} ${currentUser}`,W/2,620);
  }
  ctx.fillStyle='#666'; ctx.font='14px monospace';
  ctx.fillText('MADE BY NEUROKILLER (RPG ONLINE)',W/2,H-40);
  ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(W-90,20,70,32);
  ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.strokeRect(W-90,20,70,32);
  ctx.fillStyle='#fff'; ctx.font='bold 16px monospace'; ctx.textAlign='center';
  ctx.fillText(lang.toUpperCase(),W-55,42);
  ctx.restore();
}

function drawOptions(){
  drawMenuBg();
  ctx.save();
  ctx.textAlign='center';
  ctx.fillStyle='#f00'; ctx.font='bold 50px Impact,sans-serif';
  ctx.shadowBlur=15; ctx.shadowColor='#f00';
  ctx.fillText(t('options'),W/2,130);
  ctx.shadowBlur=0;
  const items=[
    {label:t('mouseCtrl'),value:mouseControlEnabled?t('on'):t('off')},
    {label:t('music'),value:musicEnabled?t('on'):t('off')},

  ];
  for(let i=0;i<items.length;i++){
    const y=320+i*80;
    ctx.font='bold 28px monospace';
    ctx.fillStyle=optIndex===i?'#0f0':'#fff';
    ctx.fillText((optIndex===i?'> ':'')+items[i].label+(items[i].value?' '+items[i].value:'')+(optIndex===i?' <':''),W/2,y);
  }
  ctx.fillStyle='#666'; ctx.font='16px monospace';
  ctx.fillText('[ENTER/Z] TOGGLE / SELECT',W/2,H-100);
  ctx.fillText('[ESC] BACK',W/2,H-70);
  ctx.restore();
}

function drawLogin(){
  drawMenuBg();
  ctx.save();
  ctx.textAlign='center';
  ctx.fillStyle='#f00'; ctx.font='bold 50px Impact,sans-serif';
  ctx.shadowBlur=15; ctx.shadowColor='#f00';
  ctx.fillText(t('login'),W/2,150);
  ctx.shadowBlur=0;
  ctx.font='bold 24px monospace';
  ctx.fillStyle=loginMode==='username'?'#0f0':'#fff';
  ctx.fillText((loginMode==='username'?'> ':'')+t('username')+' '+loginInput+(loginMode==='username'?'_':''),W/2,H/2-30);
  ctx.fillStyle=loginMode==='password'?'#0f0':'#fff';
  ctx.fillText((loginMode==='password'?'> ':'')+t('password')+' '+'*'.repeat(loginPass.length)+(loginMode==='password'?'_':''),W/2,H/2+30);
  if(loginError){ ctx.fillStyle='#f00'; ctx.font='bold 20px monospace'; ctx.fillText(loginError,W/2,H/2+90); }
  ctx.fillStyle='#fff'; ctx.font='bold 20px monospace';
  ctx.fillText(t('submit'),W/2,H/2+150);
  ctx.fillStyle='#888'; ctx.font='16px monospace';
  ctx.fillText('TAB switch | Z back',W/2,H/2+190);
  ctx.restore();
}

function getLeaderboardList(){
  if(lbTab===0){
    const map={};
    for(const r of leaderboardData){
      if(!map[r.nome]||(r.pp||0)>(map[r.nome].pp||0)) map[r.nome]=r;
    }
    return Object.values(map).sort((a,b)=>(b.pp||0)-(a.pp||0)).slice(0,10);
  }
  return [...leaderboardData].sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)).slice(0,10);
}

function drawLeaderboard(){
  drawMenuBg();
  ctx.save();
  ctx.textAlign='center';
  ctx.fillStyle='#f00'; ctx.font='bold 40px Impact,sans-serif';
  ctx.shadowBlur=15; ctx.shadowColor='#f00';
  ctx.fillText('🏆 LEADERBOARD 🏆',W/2,70);
  ctx.shadowBlur=0;
  ctx.font='bold 18px monospace';
  ctx.fillStyle=lbTab===0?'#0f0':'#666'; ctx.fillText('[ '+t('topPlayers')+' ]',W/2-150,120);
  ctx.fillStyle=lbTab===1?'#0f0':'#666'; ctx.fillText('[ '+t('recent')+' ]',W/2+150,120);
  const list=getLeaderboardList();
  if(!isBinConfigured()){
    ctx.fillStyle='#ff0'; ctx.font='20px monospace';
    ctx.fillText('Configure JSONBin no código!',W/2,300);
  } else if(list.length===0){
    ctx.fillStyle='#fff'; ctx.font='18px monospace';
    ctx.fillText(t('noRecords'),W/2,300);
  } else {
    ctx.fillStyle='#888'; ctx.font='bold 14px monospace'; ctx.textAlign='left';
    if(lbTab===0){
      ctx.fillText('#',40,180); ctx.fillText('NAME',90,180);
      ctx.fillText('LEVEL',350,180); ctx.fillText('BOSSES',450,180);
      ctx.fillText('KILLS',570,180); ctx.fillText('PP',690,180);
    } else {
      ctx.fillText('NAME',40,180); ctx.fillText('LEVEL',250,180);
      ctx.fillText('BOSSES',350,180); ctx.fillText('KILLS',470,180);
      ctx.fillText('PP',590,180); ctx.fillText('DATE',650,180);
    }
    ctx.font='15px monospace';
    for(let i=0;i<list.length;i++){
      const r=list[i], y=215+i*42;
      if(i===selectedRow){ ctx.fillStyle='rgba(0,255,0,0.15)'; ctx.fillRect(20,y-20,W-40,34); }
      ctx.fillStyle=i===0?'#ff0':i===1?'#ccc':i===2?'#c96':'#ddd';
      ctx.textAlign='left';
      if(lbTab===0){
        ctx.fillText('#'+(i+1),40,y); ctx.fillText(r.nome||'?',90,y);
        ctx.fillText(r.level||1,350,y); ctx.fillText((r.bosses||0)+'/10',450,y);
        ctx.fillText(r.kills||0,570,y); ctx.fillText(r.pp||0,690,y);
      } else {
        ctx.fillText(r.nome||'?',40,y); ctx.fillText(r.level||1,250,y);
        ctx.fillText((r.bosses||0)+'/10',350,y); ctx.fillText(r.kills||0,470,y);
        ctx.fillText(r.pp||0,590,y); ctx.fillText(r.data||'--',650,y);
      }
    }
  }
  ctx.fillStyle='#0f0'; ctx.font='bold 22px monospace'; ctx.textAlign='center';
  ctx.fillText('[Z] BACK',W/2,H-50);
  ctx.restore();
}

function drawEndScreen(){
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.85)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  const won=gameState==='win';
  ctx.fillStyle=won?'#0f0':'#f00'; ctx.font='bold 60px Impact,sans-serif';
  ctx.shadowBlur=20; ctx.shadowColor=won?'#0f0':'#f00';
  ctx.fillText(won?t('win'):t('gameOver'),W/2,200);
  ctx.shadowBlur=0;
  ctx.fillStyle='#fff'; ctx.font='bold 22px monospace';
  const stats=[
    `${t('level')}: ${pendingScore?pendingScore.level:0}`,
    `${t('kills')}: ${pendingScore?pendingScore.kills:0}`,
    `${t('bosses')}: ${pendingScore?pendingScore.bosses:0}/10`,
    `${t('time')}: ${pendingScore?pendingScore.tempo.toFixed(2):0}s`
  ];
  for(let i=0;i<stats.length;i++) ctx.fillText(stats[i],W/2,300+i*35);
  ctx.fillStyle='#ff0'; ctx.font='bold 36px Impact,sans-serif';
  ctx.fillText(`${t('pp')}: ${pendingScore?pendingScore.pp:0}`,W/2,470);
  if(pendingScore){
    if(currentUser){
      if(isSaving){ ctx.fillStyle='#ff0'; ctx.font='bold 20px monospace'; ctx.fillText(t('saving'),W/2,540); }
      else{ ctx.fillStyle='#0f0'; ctx.font='bold 20px monospace'; ctx.fillText(`✓ ${currentUser}`,W/2,540); }
      ctx.fillStyle='#fff'; ctx.font='bold 22px monospace';
      ctx.fillText(t('pressContinue'),W/2,620);
    } else {
      ctx.fillStyle='#ff0'; ctx.font='bold 22px monospace';
      ctx.fillText(t('mustLogin'),W/2,540);
      ctx.fillStyle='#fff';
      ctx.fillText('[ENTER] '+t('login'),W/2,600);
    }
  }
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  if(gameState==='menu'){ drawMenu(); return; }
  if(gameState==='login'){ drawLogin(); return; }
  if(gameState==='leaderboard'){ drawLeaderboard(); return; }
  if(gameState==='options'){ drawOptions(); return; }

  ctx.save();
  if(shake>0) ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);

  drawWorld();

  const vL=camX-80, vR=camX+W+80, vT=camY-80, vB=camY+H+80;
  const inView=(x,y,r=40)=>x+r>vL&&x-r<vR&&y+r>vT&&y-r<vB;

  for(const o of xpOrbs){
    if(!inView(o.x,o.y,20)) continue;
    const sx=o.x-camX, sy=o.y-camY;
    ctx.save();
    ctx.shadowBlur=15; ctx.shadowColor=o.big?'#ff0':'#0ff';
    ctx.fillStyle=o.big?'#ff0':'#0ff';
    ctx.beginPath(); ctx.arc(sx,sy,o.big?14:6,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  for(const p of particles){
    if(!inView(p.x,p.y,p.r)) continue;
    ctx.globalAlpha=Math.min(1,p.life/20);
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x-camX,p.y-camY,p.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  for(const e of enemies) if(inView(e.x,e.y,30)) drawEnemy(e);
  for(const bo of bosses) if(bo.alive&&inView(bo.x,bo.y,bo.r+30)) drawBoss(bo);

  // remote player bullets
  for(const b of lobby.bullets){
    if(Date.now()-b.ts>3000) continue;
    if(!inView(b.x,b.y,10)) continue;
    ctx.globalAlpha=0.5;
    ctx.fillStyle=b.color||'#f0f';
    ctx.beginPath(); ctx.arc(b.x-camX,b.y-camY,5,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }

  // my bullets
  for(const b of bullets){
    if(!inView(b.x,b.y,b.r)) continue;
    ctx.save();
    ctx.shadowBlur=15; ctx.shadowColor=b.color;
    ctx.fillStyle=b.color;
    ctx.beginPath(); ctx.arc(b.x-camX,b.y-camY,b.r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
    ctx.restore();
  }
  for(const b of enemyBullets){
    if(!inView(b.x,b.y,b.r)) continue;
    ctx.fillStyle=b.color;
    ctx.beginPath(); ctx.arc(b.x-camX,b.y-camY,b.r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
  }

  // remote players
  for(const p of onlinePlayers){
    if(!inView(p.x,p.y,40)) continue;
    drawPlayerAt(p.x-camX,p.y-camY,p.color||'#0ff',false,p.hp/p.maxHp,p.name);
  }
  // me
  drawPlayerAt(player.x-camX,player.y-camY,myColor,true,player.hp/player.maxHp,currentUser||'You');

  for(const d of dmgTexts){
    if(!inView(d.x,d.y,30)) continue;
    ctx.globalAlpha=Math.min(1,d.life/20);
    ctx.fillStyle=d.color;
    ctx.font='bold 20px monospace';
    ctx.textAlign='center';
    ctx.strokeStyle='#000'; ctx.lineWidth=3;
    ctx.strokeText(d.text,d.x-camX,d.y-camY);
    ctx.fillText(d.text,d.x-camX,d.y-camY);
  }
  ctx.globalAlpha=1;

  drawHUD();

  if(flash>0){
    ctx.fillStyle=flashColor;
    ctx.globalAlpha=flash*0.5;
    ctx.fillRect(-50,-50,W+100,H+100);
    ctx.globalAlpha=1;
  }
  ctx.restore();

  if(gameState==='gameover'||gameState==='win') drawEndScreen();
}

// ============================================================
// INPUT
// ============================================================
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowleft','arrowright','arrowup','arrowdown',' ','backspace','tab'].includes(k)) e.preventDefault();
  tryPlayMusic();

  if(gameState==='login'){
    if(k==='tab'||k==='arrowleft'||k==='arrowright'){ loginMode=loginMode==='username'?'password':'username'; return; }
    if(k==='enter'){ submitLogin(); return; }
    if(k==='backspace'){
      if(loginMode==='username') loginInput=loginInput.slice(0,-1);
      else loginPass=loginPass.slice(0,-1);
      return;
    }
    if(k==='z'||k==='escape'){ gameState='menu'; loginError=''; return; }
    if(k.length===1){
      if(loginMode==='username'&&loginInput.length<12) loginInput+=e.key;
      else if(loginMode==='password'&&loginPass.length<16) loginPass+=e.key;
      return;
    }
  }

  if(keys[k]) return;
  keys[k]=true;
  if(k==='l') toggleLang();

  if(gameState==='menu'){
    if(k==='arrowup'||k==='w')   menuIndex=(menuIndex+3)%4;
    if(k==='arrowdown'||k==='s') menuIndex=(menuIndex+1)%4;
    if(k==='enter'||k==='z'||k===' '){
      if(menuIndex===0) startGame();
      else if(menuIndex===1){ gameState='leaderboard'; fetchLeaderboard(); selectedRow=0; lbTab=0; }
      else if(menuIndex===2){ gameState='options'; optIndex=0; }
      else{
        if(currentUser){ currentUser=null; localStorage.removeItem('ttl_user'); }
        else{ gameState='login'; loginInput=''; loginPass=''; loginMode='username'; loginError=''; }
      }
    }
  } else if(gameState==='options'){
    if(k==='arrowup'||k==='w')   optIndex=(optIndex+2)%3;
    if(k==='arrowdown'||k==='s') optIndex=(optIndex+1)%3;
    if(k==='escape')             gameState='menu';
    if(k==='enter'||k==='z'||k===' '){
      if(optIndex===0) setMouseControl(!mouseControlEnabled);
      else if(optIndex===1) setMusicEnabled(!musicEnabled);
      else gameState='menu';
    }
  } else if(gameState==='leaderboard'){
    if(k==='arrowleft'||k==='a'||k==='arrowright'||k==='d'){ lbTab=(lbTab+1)%2; selectedRow=0; }
    if(k==='arrowup'||k==='w')   selectedRow=Math.max(0,selectedRow-1);
    if(k==='arrowdown'||k==='s') selectedRow=Math.min(getLeaderboardList().length-1,selectedRow+1);
    if(k==='z'||k==='escape'||k==='enter') gameState='menu';
  } else if(gameState==='playing'){
    if(k==='x') useBomb();
  } else if(gameState==='gameover'||gameState==='win'){
    if(k==='z'||k==='enter'||k===' '){
      if(pendingScore&&!currentUser){
        gameState='login'; loginInput=''; loginPass=''; loginMode='username'; loginError='';
      } else window.location.reload();
    }
  }
});
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

function getPointerPos(e){
  const rect=canvas.getBoundingClientRect();
  const sx=canvas.width/rect.width, sy=canvas.height/rect.height;
  let cx=e.clientX, cy=e.clientY;
  if(e.touches&&e.touches.length>0){ cx=e.touches[0].clientX; cy=e.touches[0].clientY; }
  return {x:(cx-rect.left)*sx,y:(cy-rect.top)*sy};
}

canvas.addEventListener('pointerdown',e=>{
  const pos=getPointerPos(e);
  pointerActive=true; pointerSX=pos.x; pointerSY=pos.y;
  tryPlayMusic();
  if(pos.x>W-90&&pos.y<55){ toggleLang(); return; }
  if(gameState==='playing'&&isMobile&&pos.x>W-130&&pos.y>H-130){ useBomb(); return; }

  if(gameState==='menu'){
    for(let i=0;i<4;i++){
      const y=300+i*75;
      if(Math.abs(pos.y-y)<30){
        menuIndex=i;
        if(i===0) startGame();
        else if(i===1){ gameState='leaderboard'; fetchLeaderboard(); selectedRow=0; lbTab=0; }
        else if(i===2){ gameState='options'; optIndex=0; }
        else{
          if(currentUser){ currentUser=null; localStorage.removeItem('ttl_user'); }
          else{ gameState='login'; loginInput=''; loginPass=''; loginMode='username'; loginError=''; }
        }
        return;
      }
    }
  } else if(gameState==='options'){
    for(let i=0;i<3;i++){
      const y=320+i*80;
      if(Math.abs(pos.y-y)<30){
        optIndex=i;
        if(i===0) setMouseControl(!mouseControlEnabled);
        else if(i===1) setMusicEnabled(!musicEnabled);
        else gameState='menu';
        return;
      }
    }
  } else if(gameState==='login'){
    if(pos.y>H/2-60&&pos.y<H/2-10) loginMode='username';
    else if(pos.y>H/2+10&&pos.y<H/2+60) loginMode='password';
    else if(pos.y>H/2+130&&pos.y<H/2+180) submitLogin();
    else if(pos.y>H/2+200){ gameState='menu'; loginError=''; }
  } else if(gameState==='leaderboard'){
    if(pos.y>100&&pos.y<140){ lbTab=pos.x<W/2?0:1; selectedRow=0; }
    else if(pos.y>H-80) gameState='menu';
  } else if(gameState==='gameover'||gameState==='win'){
    if(pendingScore&&!currentUser){
      gameState='login'; loginInput=''; loginPass=''; loginMode='username'; loginError='';
    } else window.location.reload();
  }
});

canvas.addEventListener('pointermove',e=>{
  const pos=getPointerPos(e);
  pointerSX=pos.x; pointerSY=pos.y;
  if(e.pointerType!=='mouse') pointerActive=true;
});
canvas.addEventListener('pointerup',    ()=>{ pointerActive=false; });
canvas.addEventListener('pointercancel',()=>{ pointerActive=false; });

// ============================================================
// LOOP
// ============================================================
let lastTime=performance.now();
let accumulator=0;
const STEP=1000/60;
function loop(now){
  if(!now) now=performance.now();
  let dt=now-lastTime; lastTime=now;
  if(dt>100) dt=100;
  accumulator+=dt;
  let n=0;
  while(accumulator>=STEP){
    if(gameState==='playing') update();
    accumulator-=STEP;
    n++;
    if(n>5){ accumulator=0; break; }
  }
  draw();
  requestAnimationFrame(loop);
}

// ============================================================
// BOOT
// ============================================================
buildKanjiAtlas();
generateDecorations();
fetchLeaderboard();
if(musicEnabled) tryPlayMusic();
if(currentUser && isBinConfigured()){ onlineActive=true; onlineLoop(); }
requestAnimationFrame(loop);
</script>
